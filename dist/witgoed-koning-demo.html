<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;550;600;650;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<title>Witgoed Koning</title>
<style>
/* ==========================================================================
   Witgoed Koning — redesign demo
   Designsysteem. Alle kleuren lopen via tokens zodat licht/donker en een
   latere huisstijl-swap op één plek gebeuren.
   ========================================================================== */

:root {
  /* Merk */
  --ink:        #0F2A47;   /* marineblauw — merk, koppen */
  --ink-deep:   #0A1D33;
  --copper:     #B85C10;   /* primaire actie */
  --copper-hi:  #D4761F;
  --brass:      #D9A441;   /* accent, kroon, hairlines op donker */

  /* Neutralen, warm gebiased richting email/porselein */
  --porcelain:  #F6F4F0;
  --surface:    #FFFFFF;
  --surface-2:  #FBFAF7;
  --line:       #E3DFD7;
  --line-soft:  #EFECE5;
  --text:       #16212E;
  --muted:      #5F6B78;
  --muted-2:    #808B98;

  /* Semantisch */
  --ok:         #1B7A4B;
  --ok-bg:      #E8F3ED;
  --note:       #7A5B12;
  --note-bg:    #FBF3DF;

  /* Vorm */
  --r-sm: 4px;
  --r:    8px;
  --r-lg: 14px;
  --shadow-1: 0 1px 2px rgba(15,42,71,.06), 0 2px 8px rgba(15,42,71,.05);
  --shadow-2: 0 2px 6px rgba(15,42,71,.08), 0 12px 32px rgba(15,42,71,.10);

  --maxw: 1240px;
  --header-h: 72px;

  --f-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink:       #C8DCF0;
    --ink-deep:  #E6EFF8;
    --copper:    #E08B3E;
    --copper-hi: #F0A055;
    --brass:     #E3B559;

    --porcelain: #0C1622;
    --surface:   #132132;
    --surface-2: #16273A;
    --line:      #26394F;
    --line-soft: #1E2E42;
    --text:      #E8EDF3;
    --muted:     #9DAEC0;
    --muted-2:   #7E8FA2;

    --ok:        #4CBF88;
    --ok-bg:     #102C21;
    --note:      #E0BC6A;
    --note-bg:   #2A2314;

    --shadow-1: 0 1px 2px rgba(0,0,0,.32), 0 2px 8px rgba(0,0,0,.28);
    --shadow-2: 0 2px 6px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --ink:       #C8DCF0;
  --ink-deep:  #E6EFF8;
  --copper:    #E08B3E;
  --copper-hi: #F0A055;
  --brass:     #E3B559;
  --porcelain: #0C1622;
  --surface:   #132132;
  --surface-2: #16273A;
  --line:      #26394F;
  --line-soft: #1E2E42;
  --text:      #E8EDF3;
  --muted:     #9DAEC0;
  --muted-2:   #7E8FA2;
  --ok:        #4CBF88;
  --ok-bg:     #102C21;
  --note:      #E0BC6A;
  --note-bg:   #2A2314;
  --shadow-1: 0 1px 2px rgba(0,0,0,.32), 0 2px 8px rgba(0,0,0,.28);
  --shadow-2: 0 2px 6px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.45);
  color-scheme: dark;
}

/* --------------------------------------------------------------- basis --- */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--porcelain);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 {
  font-family: var(--f-display);
  color: var(--ink-deep);
  margin: 0;
  line-height: 1.15;
  text-wrap: balance;
  letter-spacing: -0.015em;
}
h1 { font-size: clamp(28px, 4.2vw, 44px); font-weight: 700; }
h2 { font-size: clamp(22px, 2.6vw, 30px); font-weight: 650; }
h3 { font-size: 18px; font-weight: 650; letter-spacing: -0.005em; }
p  { margin: 0; }

a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, input:focus-visible,
select:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--copper);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}

img, svg { max-width: 100%; }
ul, ol { margin: 0; padding: 0; list-style: none; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 20px; }
.stack { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.eyebrow {
  font-family: var(--f-mono);
  font-size: 11px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--muted);
}

/* ------------------------------------------------------------- knoppen --- */

.btn {
  font-family: var(--f-display);
  font-weight: 600;
  font-size: 15px;
  letter-spacing: -0.005em;
  border: 1px solid transparent;
  border-radius: var(--r);
  padding: 12px 20px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  transition: background-color .15s ease, border-color .15s ease, transform .08s ease;
  text-align: center;
}
.btn:active { transform: translateY(1px); }

.btn-primary { background: var(--copper); color: #fff; }
.btn-primary:hover { background: var(--copper-hi); }
:root[data-theme="dark"] .btn-primary,
.btn-primary { color: #fff; }

.btn-lg { padding: 15px 26px; font-size: 17px; width: 100%; }

.btn-ghost {
  background: var(--surface);
  color: var(--ink);
  border-color: var(--line);
}
.btn-ghost:hover { border-color: var(--ink); }

.btn-quiet {
  background: transparent; color: var(--muted); border-color: transparent;
  padding: 8px 10px; font-size: 14px;
}
.btn-quiet:hover { color: var(--ink); }

.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* -------------------------------------------------------------- topbar --- */

.topbar {
  background: var(--ink-deep);
  color: #E9F0F8;
  font-size: 13px;
}
:root[data-theme="dark"] .topbar,
:root:not([data-theme="light"]) .topbar { color: #E9F0F8; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .topbar { background: #08131F; }
}
:root[data-theme="dark"] .topbar { background: #08131F; }

.topbar .wrap {
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; height: 38px;
}
.topbar-usps { display: flex; gap: 22px; align-items: center; }
.topbar-usps li { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.topbar-usps svg { color: var(--brass); flex: none; }
.topbar-right { display: flex; align-items: center; gap: 18px; }
.topbar a:hover { color: var(--brass); }
@media (max-width: 900px) { .topbar-usps li:nth-child(n+2) { display: none; } }
@media (max-width: 620px) { .topbar-right .hide-s { display: none; } }

/* -------------------------------------------------------------- header --- */

.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 40;
}
.site-header .wrap {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 28px;
  height: var(--header-h);
}
.logo { display: flex; align-items: center; gap: 11px; }
.logo svg { flex: none; }
.logo-word {
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 20px;
  letter-spacing: -0.02em;
  color: var(--ink-deep);
  line-height: 1.05;
}
.logo-word span {
  display: block;
  font-family: var(--f-mono);
  font-size: 9.5px;
  font-weight: 400;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--muted);
}

.search { position: relative; max-width: 520px; width: 100%; }
.search input {
  width: 100%;
  font-family: var(--f-body);
  font-size: 15px;
  padding: 11px 14px 11px 40px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--surface-2);
  color: var(--text);
}
.search input::placeholder { color: var(--muted-2); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

.header-actions { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  background: none; border: 0; cursor: pointer; color: var(--ink);
  padding: 9px; border-radius: var(--r); display: flex; align-items: center; gap: 8px;
  font-family: var(--f-body); font-size: 14px;
}
.icon-btn:hover { background: var(--surface-2); }
.cart-btn { position: relative; }
.cart-count {
  position: absolute; top: 2px; left: 22px;
  background: var(--copper); color: #fff;
  font-family: var(--f-mono); font-size: 10px; font-weight: 600;
  min-width: 17px; height: 17px; border-radius: 9px;
  display: grid; place-items: center; padding: 0 4px;
}

.nav {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.nav .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.nav .wrap::-webkit-scrollbar { display: none; }
.nav a {
  font-family: var(--f-display); font-weight: 550; font-size: 14.5px;
  padding: 12px 14px; color: var(--ink); white-space: nowrap;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.nav a:hover { color: var(--copper); }
.nav a.on { border-bottom-color: var(--copper); color: var(--copper); }
.nav .nav-sep { flex: 1; }
.nav .nav-alt { color: var(--muted); font-weight: 450; }

@media (max-width: 860px) {
  .site-header .wrap { grid-template-columns: auto 1fr; gap: 12px; height: 62px; }
  .search { grid-column: 1 / -1; display: none; }
  .logo-word span { display: none; }
}

/* ----------------------------------------------------------------- USP --- */

.uspbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.uspbar .wrap {
  display: grid; grid-template-columns: repeat(4, 1fr);
}
.usp {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 18px 20px 18px 0;
}
.usp + .usp { border-left: 1px solid var(--line-soft); padding-left: 22px; }
.usp svg { color: var(--copper); flex: none; margin-top: 2px; }
.usp b { font-family: var(--f-display); font-weight: 600; font-size: 14.5px; display: block; color: var(--ink-deep); }
.usp small { font-size: 12.5px; color: var(--muted); line-height: 1.45; display: block; }
@media (max-width: 900px) {
  .uspbar .wrap { grid-template-columns: repeat(2, 1fr); }
  .usp:nth-child(3) { border-left: 0; padding-left: 0; }
  .usp:nth-child(n+3) { border-top: 1px solid var(--line-soft); }
}
@media (max-width: 520px) { .usp small { display: none; } }

/* ---------------------------------------------------------------- hero --- */

.hero {
  background:
    radial-gradient(120% 90% at 88% 0%, rgba(217,164,65,.14), transparent 60%),
    linear-gradient(180deg, var(--ink-deep), var(--ink-deep));
  color: #EAF1F9;
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: ""; position: absolute; inset: auto 0 0 0; height: 3px;
  background: linear-gradient(90deg, var(--brass), transparent 55%);
}
.hero .wrap {
  display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px;
  align-items: center; padding-top: 52px; padding-bottom: 52px;
}
.hero h1 { color: #fff; font-size: clamp(30px, 4.4vw, 48px); }
.hero h1 em { font-style: normal; color: var(--brass); }
.hero-lead { color: #BFD1E4; font-size: 17px; margin-top: 14px; max-width: 46ch; }
.hero-cta { display: flex; gap: 12px; margin-top: 26px; flex-wrap: wrap; }
.hero .btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.hero .btn-ghost:hover { border-color: #fff; }

.hero-proof {
  display: flex; align-items: center; gap: 18px; margin-top: 28px;
  padding-top: 22px; border-top: 1px solid rgba(255,255,255,.14);
  flex-wrap: wrap;
}
.score {
  font-family: var(--f-display); font-weight: 700; font-size: 30px; color: #fff;
  display: flex; align-items: baseline; gap: 3px;
}
.score small { font-size: 14px; font-weight: 500; color: #93A9C1; }
.stars { display: flex; gap: 2px; color: var(--brass); }
.hero-proof p { font-size: 13.5px; color: #A9BED4; }

/* Hero-visual: het "dossier"-idee meteen zichtbaar */
.hero-card {
  background: var(--surface); border-radius: var(--r-lg);
  box-shadow: var(--shadow-2); overflow: hidden;
  border: 1px solid var(--line);
}
.hero-card-top { display: grid; grid-template-columns: 132px 1fr; gap: 16px; padding: 18px; align-items: center; }
.hero-card-top .thumb { background: var(--surface-2); border-radius: var(--r); padding: 6px; border: 1px solid var(--line-soft); }
.hero-card h3 { font-size: 17px; }
.hero-card .price { font-family: var(--f-display); font-weight: 700; font-size: 26px; color: var(--ink-deep); }
.hero-card .was { font-size: 13px; color: var(--muted); text-decoration: line-through; margin-left: 7px; }
.dossier-strip {
  border-top: 1px solid var(--line);
  background: var(--surface-2);
  padding: 13px 18px;
}
.dossier-strip .eyebrow { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }
.dossier-strip .eyebrow svg { color: var(--ok); }
.dossier-rows { display: grid; gap: 5px; }
.dossier-rows li {
  display: grid; grid-template-columns: 1fr auto; gap: 12px;
  font-family: var(--f-mono); font-size: 11.5px; color: var(--muted);
  padding-bottom: 5px; border-bottom: 1px dashed var(--line);
}
.dossier-rows li:last-child { border-bottom: 0; padding-bottom: 0; }
.dossier-rows b { color: var(--ok); font-weight: 500; }
.dossier-rows b.repl { color: var(--copper); }

@media (max-width: 940px) {
  .hero .wrap { grid-template-columns: 1fr; gap: 32px; padding-top: 36px; padding-bottom: 40px; }
}

/* ------------------------------------------------------------- secties --- */

.section { padding: 56px 0; }
.section-head {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 20px; margin-bottom: 26px; flex-wrap: wrap;
}
.section-head p { color: var(--muted); font-size: 15px; margin-top: 7px; max-width: 62ch; }
.section-link { font-family: var(--f-display); font-weight: 600; font-size: 14.5px; color: var(--copper); display: inline-flex; align-items: center; gap: 6px; }
.section-link:hover { gap: 9px; }
.section-alt { background: var(--surface); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }

/* ------------------------------------------------------- categorietegel --- */

.cats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
.cat {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 16px 14px 14px;
  display: flex; flex-direction: column; gap: 10px;
  transition: border-color .15s ease, transform .15s ease;
}
.cat:hover { border-color: var(--ink); transform: translateY(-2px); }
.cat svg { color: var(--ink); }
.cat b { display: block; font-family: var(--f-display); font-size: 14.5px; font-weight: 600; color: var(--ink-deep); line-height: 1.25; }
.cat small { display: block; margin-top: 3px; font-family: var(--f-mono); font-size: 11px; color: var(--muted); line-height: 1.4; }
@media (max-width: 900px) { .cats { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 520px) { .cats { grid-template-columns: repeat(2, 1fr); } }

/* ------------------------------------------------------------ productkaart */

.grid-products { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 1080px) { .grid-products { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 820px)  { .grid-products { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 460px)  { .grid-products { grid-template-columns: 1fr; } }

.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); overflow: hidden;
  display: flex; flex-direction: column;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.card:hover { border-color: var(--ink); box-shadow: var(--shadow-1); }
.card-media { position: relative; background: var(--surface-2); padding: 14px; border-bottom: 1px solid var(--line-soft); }
.card-media svg { display: block; margin: 0 auto; }
.badge-row { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
.badge {
  font-family: var(--f-mono); font-size: 10px; letter-spacing: .06em;
  text-transform: uppercase; padding: 3px 7px; border-radius: var(--r-sm);
  background: var(--ink-deep); color: #fff;
}
.badge-save { background: var(--copper); }
.badge-cond { background: var(--surface); color: var(--ink); border: 1px solid var(--line); }

.card-body { padding: 14px; display: flex; flex-direction: column; gap: 9px; flex: 1; }
.card-brand { font-family: var(--f-mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.card h3 { font-size: 15.5px; line-height: 1.3; }
.card h3 a:hover { color: var(--copper); }
.card-specs { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  font-family: var(--f-mono); font-size: 11px; color: var(--muted);
  border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px 6px;
  background: var(--surface-2);
}
.card-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.price-row { display: flex; align-items: baseline; gap: 8px; }
.price { font-family: var(--f-display); font-weight: 700; font-size: 22px; color: var(--ink-deep); font-variant-numeric: tabular-nums; }
.was { font-size: 13px; color: var(--muted); text-decoration: line-through; }
.stockline { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ok); font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.card .sku { font-family: var(--f-mono); font-size: 10.5px; color: var(--muted-2); }

/* --------------------------------------------------------------- stappen --- */

.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
.step { padding: 0 26px; border-left: 2px solid var(--line); }
.step:first-child { padding-left: 0; border-left: 0; }
.step .n {
  font-family: var(--f-mono); font-size: 12px; color: var(--copper);
  letter-spacing: .1em; margin-bottom: 10px; display: block;
}
.step h3 { margin-bottom: 7px; }
.step p { color: var(--muted); font-size: 14.5px; }
@media (max-width: 780px) {
  .steps { grid-template-columns: 1fr; gap: 24px; }
  .step { padding: 0 0 0 18px; border-left: 2px solid var(--line); }
  .step:first-child { padding-left: 18px; border-left: 2px solid var(--line); }
}

/* --------------------------------------------------------- keuringspaneel --- */

.panel {
  border: 1px solid var(--line); border-radius: var(--r);
  background: var(--surface); overflow: hidden;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  padding: 13px 16px; border-bottom: 1px solid var(--line);
  background: var(--surface-2);
}
.panel-head b { font-family: var(--f-display); font-size: 15px; color: var(--ink-deep); }
.panel-body { padding: 4px 16px 12px; }
.check-list li {
  display: grid; grid-template-columns: 20px 1fr auto; gap: 10px;
  align-items: baseline; padding: 10px 0; border-bottom: 1px dashed var(--line);
  font-size: 14px;
}
.check-list li:last-child { border-bottom: 0; }
.check-list .ic { color: var(--ok); }
.check-list .ic.repl { color: var(--copper); }
.check-list .st {
  font-family: var(--f-mono); font-size: 11px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); white-space: nowrap;
}
.check-list .st.repl { color: var(--copper); }
.check-list em { font-style: normal; color: var(--muted); font-size: 13px; display: block; }

/* --------------------------------------------------------------- reviews --- */

.reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 880px) { .reviews { grid-template-columns: 1fr; } }
.review {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 18px;
  display: flex; flex-direction: column; gap: 11px;
}
.review .stars { color: var(--brass); }
.review p { font-size: 14.5px; color: var(--text); }
.review footer { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: center; margin-top: auto; }
.verified { display: inline-flex; align-items: center; gap: 4px; color: var(--ok); font-weight: 500; }

/* ------------------------------------------------------------------- faq --- */

.faq { max-width: 780px; }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary {
  cursor: pointer; list-style: none; padding: 16px 0;
  font-family: var(--f-display); font-weight: 600; font-size: 16px; color: var(--ink-deep);

  const DAYS = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
  const MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

  WK.deliveryDate = function (offsetDays, from) {
    const d = new Date(from || Date.now());
    let added = 0;
    const want = offsetDays == null ? 2 : offsetDays;
    while (added < want) {
      d.setDate(d.getDate() + 1);
      if (d.getDay() !== 0) added++;
    }
    return d;
  };

  WK.formatDate = function (d, withYear) {
    return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + (withYear ? ' ' + d.getFullYear() : '');

  WK.validPostcode = (v) => /^\s*[1-9][0-9]{3}\s?[a-zA-Z]{2}\s*$/.test(v || '');

  WK.toast = function (msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      toastEl.setAttribute('role', 'status');
      document.body.appendChild(toastEl);
    }
    toastEl.innerHTML = WK.icon('checkc', 18) + '<span>' + WK.esc(msg) + '</span>';
    requestAnimationFrame(() => toastEl.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  };

    switch (sort) {
      case 'price-asc':  return a.sort((x, y) => x.price - y.price);
      case 'price-desc': return a.sort((x, y) => y.price - x.price);
      case 'nieuwste':   return a.sort((x, y) => x.addedDaysAgo - y.addedDaysAgo);
      case 'korting':    return a.sort((x, y) => savingPct(y) - savingPct(x));
      default:           return a.sort((x, y) => (y.rating * y.reviews) - (x.rating * x.reviews));
    }
  }
  function savingPct(p) {
    return p.compareAt > p.price ? Math.round((1 - p.price / p.compareAt) * 100) : 0;
  }
  WK.savingPct = savingPct;

  function applyFilters(list, f) {
    f = f || {};
    return list.filter(p => {
      if (f.category && p.cat !== f.category) return false;
      if (f.brands && f.brands.length && f.brands.indexOf(p.brand) === -1) return false;
      if (f.conds && f.conds.length && f.conds.indexOf(p.cond) === -1) return false;
      if (f.minWarranty && p.warranty < f.minWarranty) return false;
      if (f.maxPrice != null && p.price > f.maxPrice) return false;
      if (f.minPrice != null && p.price < f.minPrice) return false;
      if (f.search) {
        const hay = (p.title + ' ' + p.brand + ' ' + p.model + ' ' + p.sku).toLowerCase();
        if (hay.indexOf(f.search.toLowerCase()) === -1) return false;
      }
      return true;
    });
  }

  /* ---------------------------------------------------------- mockadapter -- */

  function MockAdapter() {
    return {
      name: 'mock',
      async listCategories() { return WK.CATEGORIES; },
      async listProducts(f) {
        const list = sortList(applyFilters(WK.PRODUCTS, f), f && f.sort);
        return { items: list, total: list.length, cursor: null };
      },
      async getProduct(slug) { return WK.bySlug(slug) || null; },
      async createCheckout() { return null; }   // demo rekent lokaal af
    };
  }

  /* ------------------------------------------------------- shopifyadapter -- */

  const SHOPIFY_PRODUCT_FIELDS = `
    id handle title vendor productType availableForSale description
    featuredImage { url altText }
    images(first: 8) { nodes { url altText } }
    priceRange { minVariantPrice { amount } }
    compareAtPriceRange { maxVariantPrice { amount } }
    variants(first: 1) { nodes { id sku quantityAvailable availableForSale } }
    conditie:   metafield(namespace: "wk", key: "conditie") { value }
    garantie:   metafield(namespace: "wk", key: "garantie_maanden") { value }
    bouwjaar:   metafield(namespace: "wk", key: "bouwjaar") { value }
    specs:      metafield(namespace: "wk", key: "specificaties") { value }
    highlights: metafield(namespace: "wk", key: "pluspunten") { value }
    keuring:    metafield(namespace: "wk", key: "keuringsrapport") { value }
  `;

  function ShopifyAdapter(cfg) {
    const endpoint = 'https://' + cfg.domain + '/api/' + cfg.apiVersion + '/graphql.json';

    async function gql(query, variables) {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Shopify-Storefront-Access-Token': cfg.storefrontToken
        },
        body: JSON.stringify({ query, variables })
      });
      if (!res.ok) throw new Error('Shopify gaf status ' + res.status);
      const json = await res.json();
      if (json.errors) throw new Error(json.errors.map(e => e.message).join('; '));
      return json.data;
    }

    /* JSON-metafields kunnen leeg of ongeldig zijn; nooit de pagina laten vallen. */
    function parseJSON(mf, fallback) {
      if (!mf || !mf.value) return fallback;
      try { return JSON.parse(mf.value); } catch (e) { return fallback; }
    }

    function map(n) {
      const v = (n.variants.nodes && n.variants.nodes[0]) || {};
      const price = toNum(n.priceRange.minVariantPrice.amount);
      const compare = toNum(n.compareAtPriceRange.maxVariantPrice.amount);
      const images = (n.images.nodes || []).map(i => ({ url: i.url, alt: i.altText || n.title }));
      return {
        id: n.id,
        variantId: v.id,
        slug: n.handle,
        sku: norm(v.sku),
        title: n.title,
        brand: norm(n.vendor),
        model: '',
        cat: slugFromType(n.productType),
        kind: kindFromType(n.productType),
        price,
        compareAt: compare > price ? compare : 0,
        cond: norm(n.conditie && n.conditie.value) || 'Refurbished A',
        warranty: parseInt((n.garantie && n.garantie.value) || '6', 10),
        year: parseInt((n.bouwjaar && n.bouwjaar.value) || '0', 10),
        rating: 4.6, reviews: 0,          // vul uit je reviewpartner (Kiyoh/Judge.me)
        stock: v.quantityAvailable != null ? v.quantityAvailable : (n.availableForSale ? 1 : 0),
        available: !!n.availableForSale,
        specs: parseJSON(n.specs, {}),
        highlights: parseJSON(n.highlights, []),
        refurb: parseJSON(n.keuring, []),
        images,
        addedDaysAgo: 0
      };
    }

    function slugFromType(t) {
      const hit = WK.CATEGORIES.find(c => c.label.toLowerCase() === norm(t).toLowerCase());
      return hit ? hit.slug : 'overig';
    }
    function kindFromType(t) {
      const hit = WK.CATEGORIES.find(c => c.label.toLowerCase() === norm(t).toLowerCase());
      return hit ? hit.kind : 'wasmachine';
    }

    const SORT = {
      'price-asc':  { sortKey: 'PRICE', reverse: false },
      'price-desc': { sortKey: 'PRICE', reverse: true },
      'nieuwste':   { sortKey: 'CREATED_AT', reverse: true },
      'korting':    { sortKey: 'BEST_SELLING', reverse: false },
      'relevantie': { sortKey: 'BEST_SELLING', reverse: false }
    };

    return {
      name: 'shopify',

      async listCategories() { return WK.CATEGORIES; },

      async listProducts(f) {
        f = f || {};
        const terms = [];
        if (f.category) {
          const c = WK.CATEGORIES.find(x => x.slug === f.category);
          if (c) terms.push('product_type:"' + c.label + '"');
        }
        if (f.brands && f.brands.length) {
          terms.push('(' + f.brands.map(b => 'vendor:"' + b + '"').join(' OR ') + ')');
        }
        if (f.minPrice != null || f.maxPrice != null) {
          terms.push('variants.price:>=' + (f.minPrice || 0) +
                     (f.maxPrice != null ? ' variants.price:<=' + f.maxPrice : ''));
        }
        if (f.search) terms.push(f.search);

        const s = SORT[f.sort] || SORT.relevantie;
        const data = await gql(
          'query P($first:Int!,$q:String,$k:ProductSortKeys,$r:Boolean,$after:String){' +
          ' products(first:$first, query:$q, sortKey:$k, reverse:$r, after:$after){' +
          '  pageInfo{ hasNextPage endCursor } nodes{' + SHOPIFY_PRODUCT_FIELDS + '} } }',
          { first: f.limit || 48, q: terms.join(' ') || null, k: s.sortKey, r: s.reverse, after: f.cursor || null }
        );
        const items = data.products.nodes.map(map);
        return {
          items,
          total: items.length,
          cursor: data.products.pageInfo.hasNextPage ? data.products.pageInfo.endCursor : null
        };
      },

      async getProduct(handle) {
        const data = await gql(
          'query P($h:String!){ product(handle:$h){' + SHOPIFY_PRODUCT_FIELDS + '} }',
          { h: handle }
        );
        return data.product ? map(data.product) : null;
      },

      /* Levert de Shopify-checkout-URL op. De demo-checkout in deze build is
         alleen een ontwerp; live neemt Shopify het hier over. */
      async createCheckout(lines) {
        const data = await gql(
          'mutation C($lines:[CartLineInput!]!){ cartCreate(input:{lines:$lines}){' +
          ' cart{ checkoutUrl } userErrors{ message } } }',
          { lines: lines.map(l => ({ merchandiseId: l.variantId, quantity: l.qty })) }
        );
        const r = data.cartCreate;
        if (r.userErrors && r.userErrors.length) throw new Error(r.userErrors[0].message);
        return { url: r.cart.checkoutUrl };
      }
    };
  }

  /* --------------------------------------------------- woocommerceadapter -- */

  function WooAdapter(cfg) {
    const root = cfg.baseUrl.replace(/\/$/, '') + cfg.apiRoot;

    async function get(path, params) {
      const url = new URL(root + path);
      Object.keys(params || {}).forEach(k => {
        if (params[k] != null && params[k] !== '') url.searchParams.set(k, params[k]);
      });
      const res = await fetch(url.toString(), { headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error('WooCommerce gaf status ' + res.status);
      return { body: await res.json(), total: parseInt(res.headers.get('X-WP-Total') || '0', 10) };
    }

    /* De Store API geeft prijzen als string in de kleinste eenheid. */
    function money(prices, key) {
      if (!prices || !prices[key]) return 0;
      const minor = prices.currency_minor_unit == null ? 2 : prices.currency_minor_unit;
      return toNum(prices[key]) / Math.pow(10, minor);
    }

    /* wk_-velden komen mee via de extensions-sleutel. Zie README voor het
       mu-plugin snippet dat ze registreert; zonder dat blijft de fallback staan. */
    function ext(p) { return (p.extensions && p.extensions.wk) || {}; }

    function attr(p, name) {
      const a = (p.attributes || []).find(x => norm(x.name).toLowerCase() === name);
      return a && a.terms && a.terms.length ? a.terms.map(t => t.name).join(', ') : '';
    }

    function map(p) {
      const e = ext(p);
      const cat = (p.categories && p.categories[0]) || {};
      const price = money(p.prices, 'price');
      const regular = money(p.prices, 'regular_price');
      const known = WK.CATEGORIES.find(c => c.slug === cat.slug);
      return {
        id: p.id,
        variantId: p.id,
        slug: p.slug,
        sku: norm(p.sku),
        title: p.name,
        brand: e.merk || attr(p, 'merk') || '',
        model: e.model || attr(p, 'model') || '',
        cat: known ? known.slug : 'overig',
        kind: known ? known.kind : 'wasmachine',
        price,
        compareAt: regular > price ? regular : 0,
        cond: e.conditie || attr(p, 'conditie') || 'Refurbished A',
        warranty: parseInt(e.garantie_maanden || attr(p, 'garantie') || '6', 10),
        year: parseInt(e.bouwjaar || '0', 10),
        rating: toNum(p.average_rating) || 4.6,
        reviews: p.review_count || 0,
        stock: p.stock_availability && p.is_in_stock === false ? 0 : (p.stock_quantity != null ? p.stock_quantity : 1),
        available: p.is_in_stock !== false,
        specs: e.specificaties || {},
        highlights: e.pluspunten || [],
        refurb: e.keuringsrapport || [],
        images: (p.images || []).map(i => ({ url: i.src, alt: i.alt || p.name })),
        addedDaysAgo: 0
      };
    }

    const ORDER = {
      'price-asc':  { orderby: 'price', order: 'asc' },
      'price-desc': { orderby: 'price', order: 'desc' },
      'nieuwste':   { orderby: 'date',  order: 'desc' },
      'korting':    { orderby: 'popularity', order: 'desc' },
      'relevantie': { orderby: 'popularity', order: 'desc' }
    };

    return {
      name: 'woocommerce',

      async listCategories() {
        const { body } = await get('/products/categories', { per_page: 50 });
        return body
          .filter(c => c.count > 0)
          .map(c => {
            const known = WK.CATEGORIES.find(x => x.slug === c.slug);
            return { slug: c.slug, label: c.name, kind: known ? known.kind : 'wasmachine', blurb: c.description || '' };
          });
      },

      async listProducts(f) {
        f = f || {};
        const o = ORDER[f.sort] || ORDER.relevantie;
        const { body, total } = await get('/products', {
          category: f.category || '',
          search: f.search || '',
          min_price: f.minPrice != null ? f.minPrice * 100 : '',
          max_price: f.maxPrice != null ? f.maxPrice * 100 : '',
          per_page: f.limit || 48,
          page: f.page || 1,
          orderby: o.orderby,
          order: o.order
        });
        let items = body.map(map);
        /* Merk en conditie zitten niet in de Store API-query, dus lokaal filteren. */
        if (f.brands && f.brands.length) items = items.filter(p => f.brands.indexOf(p.brand) > -1);
        if (f.conds && f.conds.length) items = items.filter(p => f.conds.indexOf(p.cond) > -1);
        if (f.minWarranty) items = items.filter(p => p.warranty >= f.minWarranty);
        return { items, total: total || items.length, cursor: null };
      },

      async getProduct(slug) {
        const { body } = await get('/products', { slug });
        return body && body.length ? map(body[0]) : null;
      },

      /* Woo rekent af op de eigen /checkout-pagina. We vullen de servercart
         en sturen door; de Nonce komt uit de cart-respons. */
      async createCheckout(lines) {
        const cartRes = await fetch(root + '/cart', { credentials: 'include' });
        const nonce = cartRes.headers.get('Nonce') || cartRes.headers.get('X-WC-Store-API-Nonce');
        for (const l of lines) {
          await fetch(root + '/cart/add-item', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json', Nonce: nonce },
            body: JSON.stringify({ id: l.variantId, quantity: l.qty })
          });
        }
        return { url: cfg.baseUrl.replace(/\/$/, '') + '/afrekenen/' };
      }
    };
  }

  /* --------------------------------------------------------------- fabriek -- */

  WK.createStore = function (cfg) {
    switch (cfg.backend) {
      case 'shopify':
        if (!cfg.shopify.storefrontToken) {
          console.warn('[WK] Geen Storefront-token ingesteld — terug naar demodata.');
          return MockAdapter();
        }
        return ShopifyAdapter(cfg.shopify);
      case 'woocommerce':
        return WooAdapter(cfg.woocommerce);
      default:
        return MockAdapter();
    }
  };

  WK.store = WK.createStore(WK.CONFIG);

})(window.WK);


/* assets/js/cart.js */
/* Witgoed Koning — winkelwagen.
   Losse module zodat de checkout-UI niets weet van opslag. In de Shopify-
   variant vervangt cartCreate deze regels; bij WooCommerce spiegelt hij de
   servercart. Daarom staat hier alleen wat de interface nodig heeft. */
window.WK = window.WK || {};

(function (WK) {
  'use strict';

  const KEY = 'wk.cart.v1';
  const listeners = [];

  function read() {
    try {
      const raw = localStorage.getItem(KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];               // privémodus of geblokkeerde opslag
    }
  }

  function write(lines) {
    try { localStorage.setItem(KEY, JSON.stringify(lines)); } catch (e) { /* niet fataal */ }
    listeners.forEach(fn => fn(lines));
  }

  const Cart = {
    lines: () => read(),

    /* Elk toestel is uniek: maximaal de voorraad van dat artikelnummer. */
    add(product, qty) {
      const lines = read();
      const hit = lines.find(l => l.id === product.id);
      const max = Math.max(1, product.stock || 1);
      if (hit) hit.qty = Math.min(max, hit.qty + (qty || 1));
      else lines.push({
        id: product.id, variantId: product.variantId || product.id, slug: product.slug,
        title: product.title, brand: product.brand, sku: product.sku, kind: product.kind,
        price: product.price, compareAt: product.compareAt, warranty: product.warranty,
        qty: Math.min(max, qty || 1), max
      });
      write(lines);
      return lines;
    },

    setQty(id, qty) {
      const lines = read();
      const hit = lines.find(l => l.id === id);
      if (!hit) return lines;
      hit.qty = Math.max(1, Math.min(hit.max || 1, qty));
      write(lines);
      return lines;
    },

    remove(id) {
      write(read().filter(l => l.id !== id));
    },

    clear() { write([]); },

    /* Extra's die geen catalogusartikel zijn (verlengde garantie, montage). */
    addService(svc) {
      const lines = read();
      if (lines.some(l => l.id === svc.id)) return lines;
      lines.push(Object.assign({ qty: 1, max: 1, service: true }, svc));
      write(lines);
      return lines;
    },

    count() { return read().reduce((n, l) => n + l.qty, 0); },

    totals() {
      const lines = read();
      const subtotal = lines.reduce((n, l) => n + l.price * l.qty, 0);
      const wasTotal = lines.reduce((n, l) => n + (l.compareAt || l.price) * l.qty, 0);
      return {
        subtotal,
        saving: Math.max(0, wasTotal - subtotal),
        shipping: 0,                       // bezorgen en aansluiten is inbegrepen
        removal: 0,                        // oud apparaat meenemen is inbegrepen
        total: subtotal,
        vat: subtotal - subtotal / 1.21    // btw is in de prijs verwerkt
      };
    },

    onChange(fn) { listeners.push(fn); return () => listeners.splice(listeners.indexOf(fn), 1); }
  };

  WK.cart = Cart;

})(window.WK);

/* assets/js/views-plp.js */
/* Witgoed Koning — categoriepagina met filters. */
(function (WK) {
  'use strict';
  const esc = WK.esc, euro = WK.euro, icon = WK.icon, P = WK.parts;

  const SORTS = [
    ['relevantie', 'Meest gekozen'],
    ['nieuwste', 'Nieuwste eerst'],
    ['price-asc', 'Prijs laag – hoog'],
    ['price-desc', 'Prijs hoog – laag'],
    ['korting', 'Hoogste korting']
  ];

  let state = null;

  function fresh(category, search) {
    return { category: category || null, search: search || '', brands: [], conds: [], minWarranty: 0, maxPrice: null, sort: 'relevantie' };
  }

  WK.views.plp = async function (params) {
    const cat = params.category || null;
    const search = params.search || '';
    /* Nieuwe categorie of nieuwe zoekterm betekent: filters terug naar nul. */
    if (!state || state.category !== cat || state.search !== search) state = fresh(cat, search);

    const meta = cat ? WK.CATEGORIES.find(c => c.slug === cat) : null;
    const scope = await WK.store.listProducts({ category: cat, search, limit: 200 });
    const facets = buildFacets(scope.items);

    const title = meta ? meta.label : (search ? 'Zoekresultaten voor “' + esc(search) + '”' : 'Hele assortiment');
    const blurb = meta ? meta.blurb : 'Alles wat er op dit moment gekeurd en wel in de werkplaats staat.';

    return '<div class="wrap">' +
      P.crumbs([{ label: 'Home', href: '#/' }, { label: title }]) +
      '<div class="plp">' +
        '<aside class="filters" aria-label="Filters">' + renderFilters(facets) + '</aside>' +
        '<div>' +
          '<div class="plp-head">' +
            '<div><h1>' + title + '</h1><p class="sub">' + blurb + '</p></div>' +
            '<div class="sortbar"><label class="sr" for="sortsel">Sorteren</label>' +
              '<select id="sortsel" data-sort>' + SORTS.map(s =>
                '<option value="' + s[0] + '"' + (state.sort === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'
              ).join('') + '</select></div>' +
          '</div>' +
          '<div data-results>' + await renderResults() + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  };

  function buildFacets(items) {
    const brands = {}, conds = {};
    let max = 0;
    items.forEach(p => {
      brands[p.brand] = (brands[p.brand] || 0) + 1;
      conds[p.cond] = (conds[p.cond] || 0) + 1;
      max = Math.max(max, p.price);
    });
    return {
      brands: Object.keys(brands).sort().map(b => ({ v: b, n: brands[b] })),
      conds: ['Nieuwstaat', 'Refurbished A', 'Refurbished B'].filter(c => conds[c]).map(c => ({ v: c, n: conds[c] })),
      maxPrice: Math.ceil(max / 50) * 50
    };
  }

  function renderFilters(f) {
    const brandOpts = f.brands.map(b =>
      '<label class="fopt"><input type="checkbox" data-f="brands" value="' + esc(b.v) + '"' +
      (state.brands.indexOf(b.v) > -1 ? ' checked' : '') + '>' + esc(b.v) +
      '<span class="cnt">' + b.n + '</span></label>').join('');

    const condOpts = f.conds.map(c =>
      '<label class="fopt"><input type="checkbox" data-f="conds" value="' + esc(c.v) + '"' +
      (state.conds.indexOf(c.v) > -1 ? ' checked' : '') + '>' + esc(c.v) +
      '<span class="cnt">' + c.n + '</span></label>').join('');

    const price = state.maxPrice == null ? f.maxPrice : state.maxPrice;

    return '<div class="fgroup"><b>Merk</b>' + brandOpts + '</div>' +
      '<div class="fgroup"><b>Staat</b>' + condOpts +
        '<p class="muted" style="font-size:12px;margin-top:8px">Refurbished B is technisch even goed, maar heeft zichtbare gebruikssporen. Die staan bij het product op de foto.</p>' +
      '</div>' +
      '<div class="fgroup"><b>Garantie</b>' +
        '<label class="fopt"><input type="checkbox" data-f="minWarranty" value="12"' +
        (state.minWarranty === 12 ? ' checked' : '') + '>Minimaal 12 maanden</label>' +
      '</div>' +
      '<div class="fgroup"><b>Prijs tot ' + euro(price) + '</b>' +
        '<input type="range" data-f="maxPrice" min="50" max="' + f.maxPrice + '" step="10" value="' + price +
        '" style="width:100%;accent-color:var(--copper);margin-top:6px">' +
        '<div class="row" style="justify-content:space-between;font-family:var(--f-mono);font-size:11px;color:var(--muted)">' +
          '<span>' + euro(50) + '</span><span>' + euro(f.maxPrice) + '</span></div>' +
      '</div>' +
      '<div class="fgroup" style="border-bottom:0">' +
        '<button class="btn btn-quiet" data-reset style="padding-left:0">Alle filters wissen</button></div>';
  }

  async function renderResults() {
    const { items } = await WK.store.listProducts(state);
    const chips = activeChips();
    if (!items.length) {
      return chips + '<div class="empty"><h3>Geen apparaten met deze combinatie</h3>' +
        '<p class="muted" style="margin:8px 0 16px">Ruim de filters op, of bel ons — de voorraad wisselt dagelijks en wij zoeken graag mee.</p>' +
        '<button class="btn btn-ghost" data-reset>Filters wissen</button></div>';
    }
    return chips +
      '<p class="muted" style="font-size:13.5px;margin-bottom:14px">' + items.length +
      ' apparaten · allemaal op voorraad in Deventer</p>' +
      '<div class="grid-products">' + items.map(P.card).join('') + '</div>';
  }

  function activeChips() {
    const chips = [];
    state.brands.forEach(b => chips.push(['brands', b, b]));
    state.conds.forEach(c => chips.push(['conds', c, c]));
    if (state.minWarranty) chips.push(['minWarranty', '12', 'Minimaal 12 maanden garantie']);
    if (state.maxPrice != null) chips.push(['maxPrice', '', 'Tot ' + euro(state.maxPrice)]);
    if (!chips.length) return '';
    return '<div class="chips-active">' + chips.map(c =>
      '<button class="chip-x" data-clear="' + c[0] + '" data-val="' + esc(c[1]) + '">' +
      esc(c[2]) + icon('x', 12) + '</button>').join('') + '</div>';
  }

  WK.mounts.plp = function (root) {
    const results = root.querySelector('[data-results]');
    const rerender = async () => {
      results.innerHTML = await renderResults();
      bindChips();
    };

    root.addEventListener('change', async (e) => {
      const el = e.target.closest('[data-f]');
      if (!el) return;
      const key = el.dataset.f;
      if (el.type === 'checkbox') {
        if (key === 'minWarranty') state.minWarranty = el.checked ? 12 : 0;
        else {
          const arr = state[key];
          const i = arr.indexOf(el.value);
          if (el.checked && i === -1) arr.push(el.value);
          if (!el.checked && i > -1) arr.splice(i, 1);
        }
      } else if (el.type === 'range') {
        state.maxPrice = parseInt(el.value, 10);
        const label = el.closest('.fgroup').querySelector('b');
        if (label) label.textContent = 'Prijs tot ' + euro(state.maxPrice);
      }
      await rerender();
    });

    const sortSel = root.querySelector('[data-sort]');
    if (sortSel) sortSel.addEventListener('change', async () => { state.sort = sortSel.value; await rerender(); });

    function bindChips() {
      root.querySelectorAll('[data-clear]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const k = btn.dataset.clear;
          if (k === 'maxPrice') state.maxPrice = null;
          else if (k === 'minWarranty') state.minWarranty = 0;
          else state[k] = state[k].filter(v => v !== btn.dataset.val);
          WK.rerender();
        });
      });
    }

    root.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', () => {
      state = fresh(state.category, state.search);
      WK.rerender();
    }));

    bindChips();
  };

})(window.WK);

(function (WK) {
  'use strict';
  const esc = WK.esc, euro = WK.euro, icon = WK.icon, P = WK.parts;

  const VIEWS = [
    { key: 'geheel', label: 'Vooraanzicht', note: 'Foto van dit exemplaar — artikelnummer %s' },
    { key: 'paneel', label: 'Bedieningspaneel', note: 'Alle programma\'s getest, display zonder uitval' },

  WK.views.pdp = async function (params) {

    if (!p) return WK.views.notFound();

  WK.mounts.pdp = function (root, params) {
    /* Galerij-onderschriften wisselen. De illustratie blijft gelijk zolang er
       geen echte foto's uit de catalogus komen; het onderschrift laat zien
       welke opnames er per toestel horen. */
    const note = root.querySelector('[data-note]');
    root.querySelectorAll('[data-view]').forEach(btn => {
      btn.addEventListener('click', () => {
        root.querySelectorAll('[data-view]').forEach(b => b.classList.remove('on'));
        btn.classList.add('on');
        const v = VIEWS[parseInt(btn.dataset.view, 10)];
        note.textContent = v.note.replace('%s', params.slug ? (WK.bySlug(params.slug) || {}).sku || '' : '');
      });
    });

    /* Bezorgbelofte op postcode. Randstad en Overijssel sneller dan de rest —
       dat is de echte planning, dus zeg het ook. */
    const form = root.querySelector('[data-pc]');
    const out = root.querySelector('[data-pc-result]');
    if (form) form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = form.pc.value.trim();
      if (!WK.validPostcode(val)) {
        out.className = 'pc-result err';
        out.textContent = 'Vul een Nederlandse postcode in, bijvoorbeeld 7418 CJ.';
        return;
      }
      const digits = parseInt(val.slice(0, 4), 10);
      const snel = (digits >= 7000 && digits < 8300) || (digits >= 1000 && digits < 3600);
      const d = WK.deliveryDate(snel ? 2 : 3);
      out.className = 'pc-result';
      out.innerHTML = 'Bezorgd en aangesloten op <b>' + esc(WK.formatDate(d)) + '</b>' +
        ' — u kiest zelf een dagdeel bij het afrekenen.' +
        (snel ? ' Uw regio rijden wij zelf.' : '');
    });

    /* Mobiele koopbalk zodra de knop uit beeld is. */
    const sticky = root.querySelector('[data-sticky]');
    const anchor = root.querySelector('.buy-actions');
    if (sticky && anchor && 'IntersectionObserver' in window) {
      document.body.classList.add('has-sticky');
      const io = new IntersectionObserver(([entry]) => {
        sticky.classList.toggle('show', !entry.isIntersecting);
      }, { rootMargin: '-80px 0px 0px 0px' });
      io.observe(anchor);
      WK.onLeave(() => { io.disconnect(); document.body.classList.remove('has-sticky'); });
    }
  };

})(window.WK);

        '<label class="payopt' + (co.pay === o[0] ? ' on' : '') + '">' +
          '<input type="radio" name="pay" value="' + o[0] + '"' + (co.pay === o[0] ? ' checked' : '') + '>' +
          '<span><b>' + o[1] + '</b><small>' + o[2] + '</small></span>' +
          (o[3] ? '<span class="tag">' + o[3] + '</span>' : '<span></span>') +
        '</label>').join('') + '</div>' +
      '<div class="notice" style="margin-top:18px">' + icon('lock', 16) +
        '<span>Deze demo verwerkt geen echte betaling. Live neemt uw betaalprovider (Mollie of Shopify Payments) ' +
        'het hier over.</span></div>' +
      '<div class="checkout-actions">' +
        '<button class="btn btn-quiet" data-back>Terug</button>' +
        '<button class="btn btn-primary" data-place>Bestelling plaatsen · ' + euro(t.total) + '</button>' +
      '</div></section>';
  }

  function orderSummary(lines) {
    const t = WK.cart.totals();
    const d = WK.formatDate(WK.deliveryDate(2 + co.slot));
    return '<aside class="summary">' +
      '<h2 style="font-size:17px">Uw bestelling</h2>' +
      '<div>' + lines.map(l =>
        '<div class="lineitem" style="grid-template-columns:56px 1fr auto;padding:11px 0">' +
          '<div class="thumb">' + WK.appliance(l.kind === 'wrench' ? 'wasmachine' : l.kind, 44) + '</div>' +
          '<div class="li-meta"><h3 style="font-size:13.5px">' + esc(l.title) + '</h3>' +
            '<span class="mono" style="font-size:11px;color:var(--muted)">' + esc(l.sku) + ' · ' + l.qty + '×</span></div>' +
          '<span class="num" style="font-size:14px">' + euro(l.price * l.qty) + '</span>' +
        '</div>').join('') + '</div>' +
      '<ul class="sum-rows">' +
        '<li><span>Artikelen</span><span class="num">' + euro(t.subtotal) + '</span></li>' +
        '<li><span>Bezorgen, aansluiten, afvoeren</span><span class="free">gratis</span></li>' +
      '</ul>' +
      '<div class="sum-total"><b>Totaal</b><span class="price">' + euro(t.total) + '</span></div>' +
      '<div class="deliverybox"><span class="eyebrow">' + icon('calendar', 14) + 'Gekozen bezorgmoment</span>' +
        '<p class="pc-result"><b>' + d.charAt(0).toUpperCase() + d.slice(1) + '</b></p></div>' +
      '<ul class="assurances" style="border-top:1px solid var(--line);padding-top:14px">' +
        '<li>' + icon('shield', 15) + '<span>Garantie met monteur aan huis</span></li>' +
        '<li>' + icon('swap', 15) + '<span>14 dagen bedenktijd</span></li>' +
        '<li>' + icon('phone', 15) + '<span>Vragen? Bel <a href="tel:' + WK.SHOP.phoneHref +
          '" style="text-decoration:underline">' + esc(WK.SHOP.phone) + '</a></span></li>' +
      '</ul>' +
    '</aside>';
  }

  function confirmation() {
    const d = WK.formatDate(WK.deliveryDate(2 + co.slot));
    return '<div class="wrap" style="max-width:760px"><div class="done-panel" style="margin:40px 0">' +
      '<div class="tick">' + icon('check', 26) + '</div>' +
      '<h1 style="font-size:28px">Bedankt, uw bestelling staat genoteerd</h1>' +
      '<p>Bestelnummer <b class="mono">' + esc(co.orderNr) + '</b>. U ontvangt binnen een paar minuten ' +
        'een bevestiging per e-mail, met het keuringsrapport van uw apparaat als bijlage.</p>' +
      '<div class="panel" style="margin-top:26px;text-align:left">' +
        '<div class="panel-head"><b>Wat er nu gebeurt</b></div>' +
        '<div class="panel-body"><ul class="check-list">' +
          '<li><span class="ic">' + icon('check', 16) + '</span><span>Bevestiging per e-mail<em>Met factuur en keuringsrapport</em></span><span class="st">nu</span></li>' +
          '<li><span class="ic">' + icon('check', 16) + '</span><span>Wij bellen om het tijdvak te bevestigen<em>Uiterlijk de dag voor de bezorging</em></span><span class="st">binnenkort</span></li>' +
          '<li><span class="ic">' + icon('check', 16) + '</span><span>Bezorgen, aansluiten en proefdraaien<em>' + esc(d) + '</em></span><span class="st">gepland</span></li>' +
        '</ul></div>' +
      '</div>' +
      '<div style="display:flex;gap:12px;justify-content:center;margin-top:26px;flex-wrap:wrap">' +
        '<a class="btn btn-ghost" href="#/">Terug naar de winkel</a>' +
        '<a class="btn btn-primary" href="tel:' + WK.SHOP.phoneHref + '">Bel ons: ' + esc(WK.SHOP.phone) + '</a>' +
      '</div>' +
    '</div></div>';
  }

  WK.mounts.checkout = function (root) {
    root.addEventListener('click', async (e) => {
      if (e.target.closest('[data-next]')) {
        const form = root.querySelector('form[data-step="1"]');
        if (co.step === 1 && form && !form.reportValidity()) return;
        co.step = Math.min(3, co.step + 1);
        return WK.rerender();
      }
      if (e.target.closest('[data-back]')) { co.step = Math.max(1, co.step - 1); return WK.rerender(); }

      const slot = e.target.closest('[data-slot]');
      if (slot) { co.slot = parseInt(slot.dataset.slot, 10); return WK.rerender(); }

      if (e.target.closest('[data-place]')) {
        /* Live gaat de bestelling hier naar Shopify of WooCommerce. */
        const res = await WK.store.createCheckout(WK.cart.lines());
        if (res && res.url) { window.location.href = res.url; return; }
        co.orderNr = 'WK' + new Date().getFullYear() + '-' + Math.floor(1000 + Math.random() * 9000);
        co.done = true;
        WK.cart.clear();
        return WK.rerender();
      }
    });

    root.addEventListener('change', (e) => {
      if (e.target.name === 'pay') { co.pay = e.target.value; WK.rerender(); }
    });
  };

  /* ======================================================== showroom ====== */

  WK.views.showroom = async function () {
    const s = WK.SHOP;
    return '<div class="wrap">' +
      P.crumbs([{ label: 'Home', href: '#/' }, { label: 'Showroom en service' }]) +
      '<section class="section" style="padding-top:26px">' +
        '<h1 style="max-width:20ch">Showroom, service en garantie</h1>' +
        '<p class="muted" style="max-width:62ch;margin-top:14px;font-size:17px">Wij zitten sinds ' + s.since +
          ' aan de Staverenstraat in Deventer. Alles wat u online ziet staat daar fysiek, en alles wordt ' +
          'in dezelfde werkplaats gekeurd.</p>' +
      '</section>' +
      P.showroomSection() +
      P.faqSection() +
    '</div>';
  };

  WK.views.notFound = function () {
    return '<div class="wrap"><div class="empty" style="margin:60px auto;max-width:520px">' +
      '<h2>Deze pagina bestaat niet meer</h2>' +
      '<p class="muted" style="margin:10px 0 20px">Mogelijk is het apparaat verkocht — elk toestel is uniek en ' +
        'weg is weg. Bekijk wat er nu op voorraad staat.</p>' +
      '<a class="btn btn-primary" href="#/">Naar de homepage</a></div></div>';
  };

})(window.WK);


/* assets/js/app.js */
/* Witgoed Koning — router en opstart. */
(function (WK) {
  'use strict';

  const app = document.getElementById('app');
  const top = document.getElementById('chrome-top');
  const bottom = document.getElementById('chrome-bottom');

  let current = null;          // { view, params, mount }
  let leaveFns = [];

  /* Views registreren opruimwerk (observers, timers) via WK.onLeave. */
  WK.onLeave = (fn) => leaveFns.push(fn);

  /* ---------------------------------------------------------------- routes */

  function parse(hash) {
    const raw = (hash || '#/').replace(/^#/, '');
    const [path, qs] = raw.split('?');
    const q = new URLSearchParams(qs || '');
    const seg = path.split('/').filter(Boolean);

    if (!seg.length) return { view: 'home', params: {} };
    if (seg[0] === 'c') return { view: 'plp', params: { category: seg[1] || null } };
    if (seg[0] === 'p') return { view: 'pdp', params: { slug: seg[1] } };
    if (seg[0] === 'zoeken') return { view: 'plp', params: { search: q.get('q') || '' } };
    if (seg[0] === 'winkelwagen') return { view: 'cart', params: {} };
    if (seg[0] === 'afrekenen') return { view: 'checkout', params: {} };
    if (seg[0] === 'showroom') return { view: 'showroom', params: {} };
    return { view: 'notFound', params: {} };
  }

  const TITLES = {
    home: 'Witgoed Koning — tweedehands witgoed van A-merken, bezorgd en aangesloten',
    plp: 'Assortiment — Witgoed Koning',
    pdp: 'Witgoed Koning',
    cart: 'Winkelwagen — Witgoed Koning',
    checkout: 'Afrekenen — Witgoed Koning',
    showroom: 'Showroom en service — Witgoed Koning',
    notFound: 'Niet gevonden — Witgoed Koning'
  };

  /* ----------------------------------------------------------------- render */

  async function render(route, keepScroll) {
    leaveFns.forEach(fn => { try { fn(); } catch (e) { /* opruimen mag nooit blokkeren */ } });
    leaveFns = [];
    current = route;

    const view = WK.views[route.view] || WK.views.notFound;
    app.setAttribute('aria-busy', 'true');
    try {
      app.innerHTML = await view(route.params);
    } catch (err) {
      console.error(err);
      app.innerHTML = '<div class="wrap"><div class="empty" style="margin:60px auto;max-width:560px">' +
        '<h2>De catalogus is even niet bereikbaar</h2>' +
        '<p class="muted" style="margin:10px 0 18px">Probeer het zo nog eens, of bel ons op ' +
        WK.SHOP.phone + '. Wij hebben alles ook gewoon op voorraad in Deventer.</p>' +
        '<button class="btn btn-ghost" onclick="location.reload()">Opnieuw proberen</button></div></div>';
    }
    app.removeAttribute('aria-busy');

    const mount = WK.mounts[route.view];
    if (mount) mount(app, route.params);

    document.title = TITLES[route.view] || TITLES.home;
    markNav(route);
    updateBadge();
    if (!keepScroll) window.scrollTo({ top: 0, behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
  }

  /* Opnieuw tekenen zonder te scrollen — voor filters, winkelwagen, checkout. */
  WK.rerender = () => render(current, true);

  function markNav(route) {
    const active = route.view === 'plp' ? route.params.category : null;
    top.querySelectorAll('.nav a').forEach(a => {
      a.classList.toggle('on', !!active && a.getAttribute('href') === '#/c/' + active);
    });
  }

  function updateBadge() {
    const n = WK.cart.count();
    document.querySelectorAll('[data-cart-count]').forEach(el => {
      el.textContent = n;
      el.hidden = n === 0;
    });
  }

  /* -------------------------------------------------------------- opstarten */

  function boot() {
    top.innerHTML = WK.parts.topbar() + WK.parts.header();
    bottom.innerHTML = WK.parts.footer();

    const form = top.querySelector('[data-search]');
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const q = form.q.value.trim();
      location.hash = q ? '#/zoeken?q=' + encodeURIComponent(q) : '#/';
    });

    /* "In de winkelwagen" werkt overal, ook in de sticky balk. */
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('[data-add]');
      if (!btn) return;
      const p = await WK.store.getProduct(btn.dataset.add);
      if (!p) return;
      WK.cart.add(p, 1);
      WK.toast(p.brand + ' ' + p.model + ' is toegevoegd');
      updateBadge();
    });

    WK.cart.onChange(updateBadge);
    window.addEventListener('hashchange', () => {
      if (location.hash !== '#/afrekenen') WK.resetCheckout();
      render(parse(location.hash));
    });

    render(parse(location.hash));
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

})(window.WK);

</script>
