<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<title>Witgoed Koning</title>
<style>
/* ==========================================================================
   Witgoed Koning — webshop
   Opzet volgt de conventies van Nederlandse witgoedwinkels (Coolblue, Welhof,
   De Witgoedhandelaar): blauwe koptekstbalk, oranje bestelknoppen, groene
   bezorgbelofte, productlijst met opsommingstekens. Eén lettertype.
   ========================================================================== */

:root {
  --brand:      #123A63;   /* koptekstbalk, merk */
  --brand-dark: #0D2B4A;
  --link:       #12609E;   /* klikbare tekst */
  --cta:        #BF5309;   /* bestelknoppen */
  --cta-hover:  #D2600E;
  --cta-soft:   #FDF3EA;
  --green:      #157347;   /* voorraad, bezorging, gratis */
  --green-soft: #EAF5EF;
  --red:        #B42318;   /* laatste exemplaar */

  --bg:      #FFFFFF;
  --band:    #F4F5F7;      /* grijze secties */
  --band-2:  #FAFBFC;
  --line:    #DDE1E6;
  --line-2:  #EBEEF1;
  --text:    #1A1F26;
  --muted:   #5A6672;
  --muted-2: #7C8794;

  --r:    3px;
  --r-lg: 6px;
  --shadow: 0 1px 3px rgba(18,58,99,.10);
  --shadow-lg: 0 4px 18px rgba(18,58,99,.14);

  --maxw: 1220px;
  --font: "Source Sans 3", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand:      #16456F;
    --brand-dark: #102F4F;
    --link:       #6FB3E8;
    --cta:        #D9670F;
    --cta-hover:  #EC7A1E;
    --cta-soft:   #2A1B0D;
    --green:      #3FAE79;
    --green-soft: #12291F;
    --red:        #E8776C;

    --bg:      #10161D;
    --band:    #161E27;
    --band-2:  #131A22;
    --line:    #2A3542;
    --line-2:  #212B36;
    --text:    #E9EDF1;
    --muted:   #A0ACB9;
    --muted-2: #7E8B99;

    --shadow: 0 1px 3px rgba(0,0,0,.4);
    --shadow-lg: 0 4px 18px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --brand:      #16456F;
  --brand-dark: #102F4F;
  --link:       #6FB3E8;
  --cta:        #D9670F;
  --cta-hover:  #EC7A1E;
  --cta-soft:   #2A1B0D;
  --green:      #3FAE79;
  --green-soft: #12291F;
  --red:        #E8776C;
  --bg:      #10161D;
  --band:    #161E27;
  --band-2:  #131A22;
  --line:    #2A3542;
  --line-2:  #212B36;
  --text:    #E9EDF1;
  --muted:   #A0ACB9;
  --muted-2: #7E8B99;
  --shadow: 0 1px 3px rgba(0,0,0,.4);
  --shadow-lg: 0 4px 18px rgba(0,0,0,.5);
  color-scheme: dark;
}

/* ---------------------------------------------------------------- basis -- */

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; line-height: 1.25; color: var(--text); font-weight: 700; }
h1 { font-size: 27px; }
h2 { font-size: 21px; }
h3 { font-size: 16px; }
p { margin: 0; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--link); outline-offset: 1px;
}
img, svg { max-width: 100%; }
ul, ol { margin: 0; padding: 0; list-style: none; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.linkblue { color: var(--link); }
.linkblue:hover { text-decoration: underline; }

/* -------------------------------------------------------------- knoppen -- */

.btn {
  font-family: var(--font); font-weight: 700; font-size: 15px;
  border: 1px solid transparent; border-radius: var(--r);
  padding: 10px 16px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: background-color .12s ease, border-color .12s ease;
  text-align: center; line-height: 1.2;
}
.btn-primary { background: var(--cta); color: #fff; }
.btn-primary:hover { background: var(--cta-hover); }
.btn-lg { padding: 13px 20px; font-size: 16px; width: 100%; }
.btn-ghost { background: var(--bg); color: var(--text); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--muted); }
.btn-quiet { background: none; border: 0; color: var(--link); padding: 8px 4px; font-weight: 600; font-size: 14px; cursor: pointer; }
.btn-quiet:hover { text-decoration: underline; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }

/* --------------------------------------------------------- kop van de site */

.topstrip { background: var(--band); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.topstrip .wrap { display: flex; align-items: center; justify-content: space-between; gap: 14px; height: 34px; }
.topstrip ul { display: flex; gap: 20px; }
.topstrip li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.topstrip svg { color: var(--green); flex: none; }
.topstrip .right { display: flex; align-items: center; gap: 16px; }
.topstrip a:hover { color: var(--link); }
@media (max-width: 860px) { .topstrip li:nth-child(n+2), .topstrip .right a:first-child { display: none; } }

.site-header { background: var(--brand); }
.site-header .wrap {
  display: grid; grid-template-columns: auto 1fr auto;
  align-items: center; gap: 26px; height: 68px;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo svg { flex: none; }
.logo-word { color: #fff; font-weight: 700; font-size: 19px; line-height: 1.1; letter-spacing: -.01em; }
.logo-word span { display: block; font-size: 11px; font-weight: 400; color: #A9C4DE; letter-spacing: 0; }

.search { position: relative; max-width: 560px; width: 100%; }
.search input {
  width: 100%; font-family: var(--font); font-size: 15px;
  padding: 10px 44px 10px 13px; border: 1px solid var(--brand-dark);
  border-radius: var(--r); background: #fff; color: #1A1F26;
}
.search input::placeholder { color: #8A949F; }
.search button {
  position: absolute; right: 3px; top: 3px; bottom: 3px; width: 38px;
  background: var(--cta); border: 0; border-radius: 2px; color: #fff; cursor: pointer;
  display: grid; place-items: center;
}
.search button:hover { background: var(--cta-hover); }

.header-actions { display: flex; align-items: center; gap: 4px; }
.hbtn {
  display: flex; align-items: center; gap: 8px; color: #fff;
  padding: 8px 10px; border-radius: var(--r); font-size: 14px; font-weight: 600;
  background: none; border: 0; cursor: pointer; font-family: var(--font);
}
.hbtn:hover { background: rgba(255,255,255,.11); }
.hbtn small { display: block; font-weight: 400; font-size: 11px; color: #A9C4DE; }
.cart-btn { position: relative; }
.cart-count {
  position: absolute; top: 3px; left: 21px; background: var(--cta); color: #fff;
  font-size: 10px; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px;
  display: grid; place-items: center; padding: 0 4px;
}

.nav { background: var(--bg); border-bottom: 1px solid var(--line); }
.nav .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.nav .wrap::-webkit-scrollbar { display: none; }
.nav a {
  font-weight: 600; font-size: 15px; padding: 12px 14px; white-space: nowrap;
  border-bottom: 3px solid transparent; margin-bottom: -1px; color: var(--text);
}
.nav a:hover { color: var(--link); }
.nav a.on { border-bottom-color: var(--cta); }
.nav .sep { flex: 1; }
.nav .alt { color: var(--muted); font-weight: 400; font-size: 14px; }

@media (max-width: 820px) {
  .site-header .wrap { grid-template-columns: auto 1fr; gap: 10px; height: 58px; }
  .search { display: none; }
  .logo-word span { display: none; }
  .hbtn span.lbl { display: none; }
}

/* ------------------------------------------------------------ USP-balk --- */

.uspbar { background: var(--green-soft); border-bottom: 1px solid var(--line); }
.uspbar .wrap { display: flex; gap: 26px; padding-top: 9px; padding-bottom: 9px; flex-wrap: wrap; }
.uspbar li { display: flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 600; color: var(--text); }
.uspbar svg { color: var(--green); flex: none; }
@media (max-width: 760px) { .uspbar li:nth-child(n+3) { display: none; } }

/* ---------------------------------------------------------------- hero --- */

.hero { background: var(--band); border-bottom: 1px solid var(--line); }
.hero .wrap {
  display: grid; grid-template-columns: 1fr 330px; gap: 34px;
  align-items: center; padding-top: 26px; padding-bottom: 26px;
}
.hero h1 { font-size: clamp(23px, 3vw, 31px); max-width: 28ch; }
.hero p.lead { color: var(--muted); font-size: 16px; margin-top: 10px; max-width: 54ch; }
.hero-points { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 16px; }
.hero-points li { display: flex; align-items: center; gap: 7px; font-size: 14.5px; font-weight: 600; }
.hero-points svg { color: var(--green); flex: none; }
.hero-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; align-items: center; }

.ratingbox {
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 16px; display: flex; flex-direction: column; gap: 10px; text-align: center;
}
.ratingbox .big { font-size: 38px; font-weight: 700; line-height: 1; }
.ratingbox .big small { font-size: 16px; font-weight: 600; color: var(--muted); }
.ratingbox .stars { justify-content: center; }
.ratingbox p { font-size: 13px; color: var(--muted); }
.ratingbox .src { border-top: 1px solid var(--line-2); padding-top: 10px; font-size: 12.5px; color: var(--muted); }

@media (max-width: 900px) {
  .hero .wrap { grid-template-columns: 1fr; gap: 20px; padding-top: 20px; padding-bottom: 22px; }
  .ratingbox { flex-direction: row; align-items: center; text-align: left; gap: 16px; }
  .ratingbox .stars { justify-content: flex-start; }
  .ratingbox .src { border-top: 0; border-left: 1px solid var(--line-2); padding: 0 0 0 16px; }
}

/* -------------------------------------------------------------- secties -- */

.section { padding: 34px 0; }
.section.band { background: var(--band); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.section-head p { color: var(--muted); font-size: 14.5px; margin-top: 5px; max-width: 68ch; }
.section-head a { color: var(--link); font-weight: 600; font-size: 14.5px; }
.section-head a:hover { text-decoration: underline; }

/* --------------------------------------------------------- categorieën --- */

.cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.cat {
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 16px; display: grid; grid-template-columns: 70px 1fr; gap: 14px; align-items: center;
}
.cat:hover { border-color: var(--link); box-shadow: var(--shadow); }
.cat b { display: block; font-size: 16px; }
.cat small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.cat .from { display: block; color: var(--cta); font-weight: 700; font-size: 13.5px; margin-top: 4px; }
@media (max-width: 980px) { .cats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .cats { grid-template-columns: 1fr; } }

/* ------------------------------------------------------------ sterren ---- */

.stars { display: inline-flex; gap: 1px; color: #E8A33D; vertical-align: middle; }
.rating-line { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted); }
.rating-line b { color: var(--text); }

/* ----------------------------------------------------- productkaart (grid) */

.grid-products { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
@media (max-width: 1040px) { .grid-products { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 780px)  { .grid-products { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 440px)  { .grid-products { grid-template-columns: 1fr; } }

.card {
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg);
  display: flex; flex-direction: column; overflow: hidden;
}
.card:hover { border-color: var(--link); box-shadow: var(--shadow); }
.card-media { position: relative; padding: 12px; text-align: center; }
.card-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 7px; flex: 1; }
.card h3 { font-size: 15px; font-weight: 600; line-height: 1.35; }
.card h3 a:hover { color: var(--link); text-decoration: underline; }
.card ul.bul { display: flex; flex-direction: column; gap: 2px; }
.card ul.bul li { font-size: 13px; color: var(--muted); padding-left: 12px; position: relative; }
.card ul.bul li::before { content: "•"; position: absolute; left: 2px; color: var(--muted-2); }
.card-foot { margin-top: auto; padding-top: 8px; display: flex; flex-direction: column; gap: 7px; }

.badges { position: absolute; top: 8px; left: 8px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; z-index: 1; }
.badge { font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 2px; letter-spacing: .01em; }
.badge-cond { background: var(--band); color: var(--muted); border: 1px solid var(--line); }
.badge-save { background: var(--cta); color: #fff; }
.badge-outlet { background: var(--red); color: #fff; }

.price { font-size: 23px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.price-row { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
.was { font-size: 13px; color: var(--muted); text-decoration: line-through; }
.saving { font-size: 13px; color: var(--cta); font-weight: 700; }
.deliver { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--green); font-weight: 600; }
.deliver svg { flex: none; }
.artnr { font-size: 12px; color: var(--muted-2); font-variant-numeric: tabular-nums; }

/* --------------------------------------------------- productrij (lijst) -- */

.plist { border-top: 1px solid var(--line); }
.prow {
  display: grid; grid-template-columns: 168px 1fr 216px; gap: 20px;
  padding: 18px 0; border-bottom: 1px solid var(--line);
}
.prow:hover { background: var(--band-2); }
.prow-media { position: relative; text-align: center; align-self: start; }
.prow-main { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.prow-main h3 { font-size: 17px; font-weight: 700; }
.prow-main h3 a:hover { color: var(--link); text-decoration: underline; }
.prow-brand { font-size: 13px; color: var(--muted); font-weight: 600; }
.prow ul.bul { display: flex; flex-direction: column; gap: 3px; margin-top: 2px; }
.prow ul.bul li { font-size: 14px; color: var(--text); padding-left: 15px; position: relative; }
.prow ul.bul li::before { content: "•"; position: absolute; left: 3px; color: var(--muted-2); }
.prow-buy {
  border-left: 1px solid var(--line-2); padding-left: 20px;
  display: flex; flex-direction: column; gap: 8px; align-items: flex-start;
}
.prow-buy .btn { width: 100%; }
.prow-buy .price { font-size: 26px; }

@media (max-width: 860px) {
  .prow { grid-template-columns: 110px 1fr; gap: 14px; }
  .prow-buy { grid-column: 1 / -1; border-left: 0; padding-left: 0; border-top: 1px solid var(--line-2); padding-top: 12px; }
  .prow-buy .btn { width: auto; min-width: 190px; }
}

/* --------------------------------------------------------------- PLP ----- */

.plp { display: grid; grid-template-columns: 232px 1fr; gap: 30px; align-items: start; padding: 20px 0 44px; }
@media (max-width: 900px) { .plp { grid-template-columns: 1fr; gap: 14px; } }

.filters { position: sticky; top: 14px; }
@media (max-width: 900px) { .filters { position: static; } }
.fgroup { border-bottom: 1px solid var(--line); padding: 14px 0; }
.fgroup:first-child { padding-top: 0; }
.fgroup > b { display: block; font-size: 14.5px; margin-bottom: 8px; }
.fopt { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 14px; cursor: pointer; }
.fopt input { accent-color: var(--link); width: 15px; height: 15px; cursor: pointer; flex: none; }
.fopt .cnt { margin-left: auto; font-size: 12.5px; color: var(--muted-2); }
.fopt:hover { color: var(--link); }
.fhint { font-size: 12.5px; color: var(--muted); margin-top: 7px; line-height: 1.45; }

.plp-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
.plp-head p { color: var(--muted); font-size: 14.5px; margin-top: 5px; max-width: 66ch; }
.sortbar { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.sortbar select {
  font-family: var(--font); font-size: 14px; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--text); cursor: pointer;
}
.chips-active { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip-x {
  display: inline-flex; align-items: center; gap: 6px; background: var(--band);
  border: 1px solid var(--line); color: var(--text); border-radius: 2px;
  padding: 4px 7px 4px 10px; font-size: 13px; cursor: pointer; font-family: var(--font);
}
.chip-x:hover { border-color: var(--muted); }
.resultcount { font-size: 14px; color: var(--muted); margin-bottom: 10px; }
.crumbs { font-size: 13px; color: var(--muted); padding: 12px 0 0; display: flex; gap: 7px; flex-wrap: wrap; }
.crumbs a { color: var(--link); }
.crumbs a:hover { text-decoration: underline; }
.empty { text-align: center; padding: 46px 20px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--band-2); }

/* --------------------------------------------------------------- PDP ----- */

.pdp { display: grid; grid-template-columns: 1fr 336px; gap: 32px; align-items: start; padding: 16px 0 44px; }
@media (max-width: 1000px) { .pdp { grid-template-columns: 1fr; gap: 22px; } }

.pdp-top { display: grid; grid-template-columns: 380px 1fr; gap: 26px; align-items: start; }
@media (max-width: 720px) { .pdp-top { grid-template-columns: 1fr; } }

.gallery-main {
  border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg);
  padding: 20px; display: grid; place-items: center; position: relative;
}
.gallery-note { position: absolute; left: 10px; bottom: 10px; font-size: 12px; color: var(--muted); background: var(--band); border: 1px solid var(--line); padding: 3px 7px; border-radius: 2px; }
.gallery-thumbs { display: flex; gap: 7px; margin-top: 8px; }
.gthumb { border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); padding: 4px; width: 62px; height: 62px; display: grid; place-items: center; cursor: pointer; }
.gthumb.on { border-color: var(--link); border-width: 2px; padding: 3px; }

.why { display: flex; flex-direction: column; gap: 7px; margin-top: 14px; }
.why li { display: grid; grid-template-columns: 17px 1fr; gap: 9px; font-size: 14.5px; align-items: start; }
.why svg { color: var(--green); margin-top: 3px; }

.buybox { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg); padding: 16px; display: flex; flex-direction: column; gap: 13px; position: sticky; top: 14px; }
@media (max-width: 1000px) { .buybox { position: static; } }
.buybox .price { font-size: 32px; }
.pricebox { display: flex; flex-direction: column; gap: 3px; }
.incl { font-size: 13px; color: var(--muted); }
.assurances { display: flex; flex-direction: column; gap: 8px; }
.assurances li { display: grid; grid-template-columns: 17px 1fr; gap: 9px; font-size: 14px; align-items: start; }
.assurances svg { color: var(--green); margin-top: 3px; }
.assurances b { font-weight: 700; }

.deliverybox { background: var(--band); border: 1px solid var(--line); border-radius: var(--r); padding: 11px 12px; display: flex; flex-direction: column; gap: 8px; }
.deliverybox > b { font-size: 14px; }
.pc-form { display: flex; gap: 7px; }
.pc-form input { flex: 1; min-width: 0; font-family: var(--font); font-size: 14px; text-transform: uppercase; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--text); }
.pc-form button { padding: 8px 12px; font-size: 14px; }
.pc-result { font-size: 13.5px; }
.pc-result b { color: var(--green); }
.pc-result.err { color: var(--red); }

.paystrip { display: flex; gap: 5px; flex-wrap: wrap; }
.paystrip span { font-size: 11.5px; border: 1px solid var(--line); border-radius: 2px; padding: 3px 6px; color: var(--muted); background: var(--band-2); font-weight: 600; }

.pdp-sections { display: flex; flex-direction: column; gap: 26px; margin-top: 30px; }
.pdp-sections h2 { margin-bottom: 12px; }
.spec-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.spec-table th, .spec-table td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.spec-table tr:nth-child(odd) { background: var(--band-2); }
.spec-table th { font-weight: 400; color: var(--muted); width: 44%; }
.spec-table td { font-weight: 600; font-variant-numeric: tabular-nums; }
.table-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-lg); }

.sticky-buy {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: var(--bg);

}

.sticky-buy .btn { flex: none; min-width: 180px; }
@media (max-width: 1000px) { .sticky-buy.show { display: flex; } body.has-sticky { padding-bottom: 70px; } }

/* --------------------------------------------------- keuringspaneel ------ */

.panel { border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; background: var(--bg); }

.check-list li { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line-2); font-size: 14.5px; }
.check-list li:last-child { border-bottom: 0; }

.check-list .st { font-size: 12.5px; font-weight: 700; color: var(--green); white-space: nowrap; }

.reviews { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

/* ------------------------------------------------------------------ faq -- */

.faq { max-width: 800px; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
.faq details { border-bottom: 1px solid var(--line); }
.faq details:last-child { border-bottom: 0; }
.faq summary { cursor: pointer; list-style: none; padding: 13px 15px; font-weight: 600; font-size: 15.5px; display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.faq summary::-webkit-details-marker { display: none; }

.faq summary::after { content: "+"; font-size: 19px; color: var(--link); flex: none; line-height: 1; }
.faq details[open] summary::after { content: "\2013"; }
.faq details p { padding: 0 15px 15px; color: var(--muted); font-size: 14.5px; max-width: 72ch; }

/* ------------------------------------------------------ zo werkt het ----- */

.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }

.how-item { display: grid; grid-template-columns: 38px 1fr; gap: 13px; align-items: start; }

.how-item p { font-size: 14.5px; color: var(--muted); }

/* ----------------------------------------------------------- winkelwagen - */

.cartpage, .checkout { display: grid; grid-template-columns: 1fr 340px; gap: 28px; align-items: start; padding: 20px 0 44px; }
@media (max-width: 900px) { .cartpage, .checkout { grid-template-columns: 1fr; } }

.lineitem { display: grid; grid-template-columns: 90px 1fr auto; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
.lineitem .thumb { border: 1px solid var(--line-2); border-radius: var(--r); padding: 5px; text-align: center; }
.li-meta { display: flex; flex-direction: column; gap: 5px; min-width: 0; }

.li-right { text-align: right; display: flex; flex-direction: column; gap: 7px; align-items: flex-end; }
.qty { display: flex; align-items: center; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.qty button { background: var(--bg); border: 0; cursor: pointer; width: 28px; height: 28px; color: var(--text); font-size: 15px; font-family: var(--font); }
.qty button:hover { background: var(--band); }
.qty span { min-width: 30px; text-align: center; font-size: 14px; font-variant-numeric: tabular-nums; }
.li-remove { background: none; border: 0; color: var(--link); font-size: 13px; cursor: pointer; font-family: var(--font); padding: 0; }
.li-remove:hover { text-decoration: underline; }

.summary { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg); padding: 16px; display: flex; flex-direction: column; gap: 12px; position: sticky; top: 14px; }

.sum-rows { display: flex; flex-direction: column; gap: 7px; font-size: 14.5px; }
.sum-rows li { display: flex; justify-content: space-between; gap: 12px; }
.sum-rows .free { color: var(--green); font-weight: 700; }
.sum-total { display: flex; justify-content: space-between; align-items: baseline; padding-top: 11px; border-top: 1px solid var(--line); }
.sum-total b { font-size: 15px; }

.upsell { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 13px; background: var(--cta-soft); display: grid; grid-template-columns: 20px 1fr; gap: 11px; align-items: start; margin-top: 16px; }
.upsell svg { color: var(--cta); margin-top: 2px; }
.upsell b { display: block; font-size: 14.5px; }
.upsell p { font-size: 13.5px; color: var(--muted); margin: 3px 0 9px; }

/* ------------------------------------------------------------- checkout -- */

.progress { display: flex; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; margin-bottom: 20px; }
.pstep { flex: 1; padding: 11px 13px; font-size: 14.5px; font-weight: 600; color: var(--muted); display: flex; align-items: center; gap: 8px; border-right: 1px solid var(--line); background: var(--band); }
.pstep:last-child { border-right: 0; }
.pstep .n { width: 20px; height: 20px; border-radius: 50%; background: var(--line); color: var(--muted); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.pstep.on { background: var(--bg); color: var(--text); }
.pstep.on .n { background: var(--brand); color: #fff; }

.pstep.done .n { background: var(--green); color: #fff; }

.formgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 13px; }

.field.full { grid-column: 1 / -1; }
.field label { font-size: 13.5px; font-weight: 600; }
.field input, .field select, .field textarea {

.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }

.slot { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; cursor: pointer; background: var(--bg); display: flex; flex-direction: column; gap: 2px; text-align: left; font-family: var(--font); }
.slot:hover { border-color: var(--link); }
.slot.on { border-color: var(--cta); border-width: 2px; padding: 11px; }
.slot b { font-size: 14.5px; }

.paylist { display: flex; flex-direction: column; gap: 8px; }
.payopt { display: grid; grid-template-columns: 18px 1fr auto; gap: 11px; align-items: center; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 13px; cursor: pointer; background: var(--bg); }
.payopt.on { border-color: var(--cta); border-width: 2px; padding: 11px 12px; }
.payopt input { accent-color: var(--cta); width: 16px; height: 16px; }
.payopt b { font-size: 14.5px; }
.payopt small { display: block; font-size: 13px; color: var(--muted); }
.payopt .tag { font-size: 11.5px; font-weight: 700; color: var(--green); background: var(--green-soft); border-radius: 2px; padding: 3px 6px; }

.checkout-actions { display: flex; justify-content: space-between; gap: 13px; margin-top: 20px; align-items: center; flex-wrap: wrap; }
.done-panel { text-align: center; padding: 38px 20px; border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--bg); }
.done-panel .tick { width: 50px; height: 50px; border-radius: 50%; background: var(--green-soft); color: var(--green); display: grid; place-items: center; margin: 0 auto 14px; }
.done-panel p { color: var(--muted); margin-top: 8px; max-width: 54ch; margin-left: auto; margin-right: auto; }

/* ------------------------------------------------------------- showroom -- */

.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: start; }
@media (max-width: 880px) { .twocol { grid-template-columns: 1fr; gap: 20px; } }
.nap { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.nap li { display: grid; grid-template-columns: 18px 1fr; gap: 11px; font-size: 15px; align-items: start; }
.nap svg { color: var(--link); margin-top: 3px; }
.nap b { display: block; }
.nap span { color: var(--muted); font-size: 14px; }
.hours li { display: flex; justify-content: space-between; padding: 7px 14px; font-size: 14px; border-bottom: 1px solid var(--line-2); }
.hours li:last-child { border-bottom: 0; }
.hours li:nth-child(odd) { background: var(--band-2); }
.hours .day { color: var(--muted); }

/* --------------------------------------------------------------- footer -- */

.site-footer { background: var(--brand); color: #C9DBEC; padding: 34px 0 20px; margin-top: 28px; }
.foot-grid { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 28px; }
@media (max-width: 880px) { .foot-grid { grid-template-columns: 1fr 1fr; gap: 22px; } }
@media (max-width: 480px) { .foot-grid { grid-template-columns: 1fr; } }
.site-footer h4 { color: #fff; font-size: 14.5px; margin-bottom: 9px; }
.site-footer li { padding: 3px 0; font-size: 14px; }
.site-footer a:hover { color: #fff; text-decoration: underline; }
.foot-about { font-size: 14px; color: #A9C4DE; margin-top: 12px; max-width: 40ch; }
.foot-bottom { margin-top: 26px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,.15); display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: #A9C4DE; }
.site-footer .paystrip span { border-color: rgba(255,255,255,.24); color: #C9DBEC; background: rgba(255,255,255,.06); }

/* ----------------------------------------------------------------- rest -- */

.notice { background: var(--band); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 11px 13px; font-size: 14px; display: grid; grid-template-columns: 17px 1fr; gap: 10px; align-items: start; color: var(--muted); }
.notice svg { color: var(--link); margin-top: 3px; }
.notice a { color: var(--link); text-decoration: underline; }

.toast {
  position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(140%);
  background: var(--green); color: #fff; padding: 12px 18px; border-radius: var(--r-lg);
  box-shadow: var(--shadow-lg); font-size: 14.5px; font-weight: 600; z-index: 90;
  transition: transform .24s ease; display: flex; align-items: center; gap: 9px; max-width: calc(100vw - 28px);
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast svg { flex: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
}

<script>
/* assets/js/ui.js */
/* Witgoed Koning — UI primitives: iconen, apparaat-illustraties, formatters. */
window.WK = window.WK || {};

(function (WK) {
  'use strict';

  const euroFmt = new Intl.NumberFormat('nl-NL', {
    style: 'currency', currency: 'EUR', minimumFractionDigits: 0, maximumFractionDigits: 0
  });
  const euroFmt2 = new Intl.NumberFormat('nl-NL', {
    style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2
  });

  WK.euro = (n) => (Number.isInteger(n) ? euroFmt : euroFmt2).format(n);
  WK.esc = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  /* --------------------------------------------------------------- iconen -- */
  /* Monoline, 1.6px, currentColor. Bewust klein gehouden — alleen wat de
     interface echt gebruikt. */
  const P = {

    shield:  '<path d="M12 2.6 4.5 5.6v6c0 4.4 3 8.3 7.5 9.8 4.5-1.5 7.5-5.4 7.5-9.8v-6z"/><path d="m8.7 11.8 2.3 2.3 4.4-4.6"/>',
    recycle: '<path d="M7.6 4.5 4.2 10.3M16.4 4.5l3.4 5.8M4.6 14.4h6.6M12.8 14.4h6.6"/><path d="m3.2 12.2 1.4 2.2 2.3-1M20.8 12.2l-1.4 2.2-2.3-1M9.6 3.4l2.4-1 1.3 2.3"/>',
    clock:   '<circle cx="12" cy="12" r="9"/><path d="M12 6.8V12l3.4 2"/>',
    check:   '<path d="m4.5 12.4 4.8 4.8L19.5 7"/>',
    checkc:  '<circle cx="12" cy="12" r="9"/><path d="m8 12.2 2.7 2.7L16.2 9.3"/>',
    swap:    '<path d="M4 8.4h13M13.6 5l3.4 3.4-3.4 3.4M20 15.6H7M10.4 12.2 7 15.6l3.4 3.4"/>',
    search:  '<circle cx="10.8" cy="10.8" r="6.4"/><path d="m15.6 15.6 4 4"/>',
    cart:    '<path d="M2.6 3.4h2.8l2.4 11.2h9.6l2-7.6H6.2"/><circle cx="9.4" cy="19.4" r="1.6"/><circle cx="16.8" cy="19.4" r="1.6"/>',
    phone:   '<path d="M5 3.4h3.4l1.7 4.2-2.1 1.6a12 12 0 0 0 5.8 5.8l1.6-2.1 4.2 1.7V18a2.6 2.6 0 0 1-2.8 2.6C9.2 20 4 14.8 3.4 6.2A2.6 2.6 0 0 1 5 3.4z"/>',
    pin:     '<path d="M12 21.4s7-6.2 7-11.2a7 7 0 1 0-14 0c0 5 7 11.2 7 11.2z"/><circle cx="12" cy="10" r="2.7"/>',
    star:    '<path d="m12 3.6 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 10l6.1-.9z" fill="currentColor" stroke="none"/>',
    arrow:   '<path d="M4.5 12h15M13.6 6l6 6-6 6"/>',
    wrench:  '<path d="M20 5.4a5.4 5.4 0 0 1-7 7L5.6 19.8a2 2 0 0 1-2.8-2.8L10.2 9.6a5.4 5.4 0 0 1 7-7l-3.3 3.3.9 3.4 3.4.9z"/>',
    calendar:'<rect x="3.4" y="5" width="17.2" height="15.6" rx="2"/><path d="M3.4 10h17.2M8.2 3v4M15.8 3v4"/>',
    info:    '<circle cx="12" cy="12" r="9"/><path d="M12 11.2V16.4M12 7.8v.6"/>',
    x:       '<path d="M6 6l12 12M18 6 6 18"/>',
    lock:    '<rect x="4.6" y="10.4" width="14.8" height="10.2" rx="2"/><path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.6 0v2.8"/>',
    user:    '<circle cx="12" cy="8.2" r="3.9"/><path d="M4.4 20.4c.6-4 3.8-6.2 7.6-6.2s7 2.2 7.6 6.2"/>',
    tag:     '<path d="M11.4 3.4H20v8.6l-8.8 8.8a1.8 1.8 0 0 1-2.6 0l-6-6a1.8 1.8 0 0 1 0-2.6z"/><circle cx="16.2" cy="7.8" r="1.3"/>'
  };

  WK.icon = function (name, size, extra) {
    const d = P[name] || '';
    const s = size || 18;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ' +
      'aria-hidden="true"' + (extra ? ' ' + extra : '') + '>' + d + '</svg>';
  };

  WK.stars = function (rating, size) {
    const s = size || 13;
    let out = '<span class="stars" aria-label="' + rating + ' van 5 sterren">';
    for (let i = 0; i < 5; i++) {
      out += '<svg width="' + s + '" height="' + s + '" viewBox="0 0 24 24" aria-hidden="true" style="opacity:' +
        (i < Math.round(rating) ? 1 : .26) + '">' + P.star + '</svg>';
    }
    return out + '</span>';
  };

  /* ----------------------------------------------- apparaat-illustraties -- */
  /* Vervang deze door echte productfoto's zodra de catalogus gekoppeld is;

  const BODY = 'fill="var(--bg)" stroke="var(--brand)" stroke-width="2.2"';
  const SOFT = 'stroke="var(--line)" stroke-width="1.6" fill="none"';
  const GLASS = 'fill="var(--band)" stroke="var(--brand)" stroke-width="2"';

  const SHAPES = {
    wasmachine:
      '<rect x="26" y="18" width="108" height="124" rx="9" ' + BODY + '/>' +

      '<circle cx="80" cy="95" r="36" ' + GLASS + '/>' +
      '<circle cx="80" cy="95" r="25" ' + SOFT + '/>' +
      '<circle cx="118" cy="31" r="7" fill="none" stroke="var(--cta)" stroke-width="2.2"/>' +
      '<path d="M118 27v4" stroke="var(--cta)" stroke-width="2.2" stroke-linecap="round"/>' +
      '<rect x="40" y="27" width="34" height="8" rx="4" fill="var(--line-2)"/>',
    wasdroger:
      '<rect x="26" y="18" width="108" height="124" rx="9" ' + BODY + '/>' +
      '<path d="M26 44h108" ' + SOFT + '/>' +
      '<circle cx="80" cy="95" r="36" ' + GLASS + '/>' +
      '<path d="M69 88q5.5-7 11 0t11 0M69 102q5.5-7 11 0t11 0" stroke="var(--cta)" stroke-width="2" fill="none" stroke-linecap="round"/>' +
      '<circle cx="118" cy="31" r="7" fill="none" stroke="var(--cta)" stroke-width="2.2"/>' +
      '<rect x="40" y="27" width="34" height="8" rx="4" fill="var(--line-2)"/>',
    vaatwasser:
      '<rect x="30" y="14" width="100" height="132" rx="8" ' + BODY + '/>' +
      '<path d="M30 40h100" ' + SOFT + '/>' +
      '<rect x="44" y="23" width="46" height="8" rx="4" fill="var(--line-2)"/>' +
      '<circle cx="112" cy="27" r="4.5" fill="var(--cta)"/>' +
      '<rect x="44" y="54" width="72" height="76" rx="5" ' + GLASS + '/>' +
      '<path d="M44 78h72M44 102h72" ' + SOFT + '/>' +
      '<path d="M58 66h14M58 90h20M58 114h11" stroke="var(--line)" stroke-width="2.4" stroke-linecap="round"/>'
  };

  WK.appliance = function (kind, size) {
    const s = size || 160;
    const shape = SHAPES[kind] || SHAPES.wasmachine;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 160 160" role="img" ' +
      'aria-label="Illustratie ' + WK.esc(kind) + '" style="max-width:100%;height:auto">' +
      shape + '</svg>';
  };

  /* ----------------------------------------------------------------- logo -- */
  /* Placeholder-merkteken: wasmachinedeur met kroon. Vervang het <svg> hier
     door het officiële logo — de rest van de site raakt het niet aan. */
  WK.logo = function (size) {
    const s = size || 36;
    return '<svg width="' + s + '" height="' + s + '" viewBox="0 0 40 40" fill="none" role="img" aria-label="Witgoed Koning">' +
      '<path d="M7 4.5 11 8.6 15.5 1.8 20 8.6 24.5 1.8 29 8.6 33 4.5V11H7z" fill="#E8A33D"/>' +
      '<rect x="4" y="12" width="32" height="25" rx="4" fill="#fff"/>' +
      '<circle cx="20" cy="24.5" r="8.4" fill="none" stroke="#123A63" stroke-width="2.4"/>' +
      '<circle cx="20" cy="24.5" r="3.4" fill="none" stroke="#123A63" stroke-width="1.3" opacity=".45"/>' +
      '<rect x="7.5" y="15" width="8" height="2.6" rx="1.3" fill="#123A63" opacity=".3"/>' +
      '</svg>';
  };

  /* ------------------------------------------------------------ leverdatum -- */
  /* Bezorgbelofte: eerstvolgende bezorgdag. Ma-za bezorgen, zondag niet.
     Voor 16:00 besteld telt vandaag mee als verwerkingsdag. */
  const DAYS = ['zondag', 'maandag', 'dinsdag', 'woensdag', 'donderdag', 'vrijdag', 'zaterdag'];
  const MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];

  WK.deliveryDate = function (offsetDays, from) {
    const d = new Date(from || Date.now());
    let added = 0;
    const want = offsetDays == null ? 2 : offsetDays;
    while (added < want) {
      d.setDate(d.getDate() + 1);
      if (d.getDay() !== 0) added++;
    }
    return d;
  };

  WK.formatDate = function (d, withYear) {
    return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + (withYear ? ' ' + d.getFullYear() : '');
  };

  const DAYS_S = ['zo', 'ma', 'di', 'wo', 'do', 'vr', 'za'];
  const MONTHS_S = ['jan', 'feb', 'mrt', 'apr', 'mei', 'jun', 'jul', 'aug', 'sep', 'okt', 'nov', 'dec'];
  WK.shortDate = (d) => DAYS_S[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS_S[d.getMonth()];

  WK.validPostcode = (v) => /^\s*[1-9][0-9]{3}\s?[a-zA-Z]{2}\s*$/.test(v || '');

  /* ---------------------------------------------------------------- toast -- */
  let toastEl, toastTimer;
  WK.toast = function (msg) {
    if (!toastEl) {
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      toastEl.setAttribute('role', 'status');
      document.body.appendChild(toastEl);
    }
    toastEl.innerHTML = WK.icon('checkc', 18) + '<span>' + WK.esc(msg) + '</span>';
    requestAnimationFrame(() => toastEl.classList.add('show'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
  };

})(window.WK);

/* assets/js/adapters.js */
/* Witgoed Koning — datalaag.
   ===========================================================================
   De hele interface praat uitsluitend met WK.store. Welke backend daaronder
   zit bepaalt WK.CONFIG.backend: 'mock' | 'shopify' | 'woocommerce'.
   Alle drie de adapters geven exact dezelfde productvorm terug, zodat het
   omzetten van demo naar live één regel configuratie is.

   Genormaliseerd product:
     id, slug, sku, title, brand, model, cat, kind, price, compareAt,
     cond, warranty, year, rating, reviews, stock, available,
     specs {label: waarde}, highlights [string], refurb [{item,status,note}],
     images [{url, alt}]                     (leeg = illustratie als fallback)
   =========================================================================== */
window.WK = window.WK || {};

(function (WK) {
  'use strict';

  WK.CONFIG = {
    backend: 'mock',

    shopify: {
      domain: 'witgoed-koning.myshopify.com',
      storefrontToken: '',            // Storefront API access token
      apiVersion: '2025-07',
      /* Metafields in de namespace 'wk' dragen wat Shopify zelf niet kent.
         Maak ze aan onder Instellingen -> Aangepaste gegevens -> Producten. */
      metafieldNamespace: 'wk'
    },

    woocommerce: {
      baseUrl: 'https://witgoed-koning.nl',
      /* De Store API is publiek en heeft geen sleutel nodig voor lezen.
         De wk_-velden moeten wel zichtbaar gemaakt worden — zie README. */
      apiRoot: '/wp-json/wc/store/v1'
    }
  };

  /* ------------------------------------------------------------- helpers -- */

  const norm = (s) => (s || '').toString().trim();
  const toNum = (v) => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };

  function sortList(list, sort) {
    const a = list.slice();
    switch (sort) {
      case 'price-asc':  return a.sort((x, y) => x.price - y.price);
      case 'price-desc': return a.sort((x, y) => y.price - x.price);
      case 'nieuwste':   return a.sort((x, y) => x.addedDaysAgo - y.addedDaysAgo);
      case 'korting':    return a.sort((x, y) => savingPct(y) - savingPct(x));
      default:           return a.sort((x, y) => (y.rating * y.reviews) - (x.rating * x.reviews));
    }
  }
  function savingPct(p) {
    return p.compareAt > p.price ? Math.round((1 - p.price / p.compareAt) * 100) : 0;
  }
  WK.savingPct = savingPct;

  function applyFilters(list, f) {
    f = f || {};
    return list.filter(p => {
      if (f.category && !WK.inCategory(p, f.category)) return false;
      if (f.brands && f.brands.length && f.brands.indexOf(p.brand) === -1) return false;
      if (f.conds && f.conds.length && f.conds.indexOf(p.cond) === -1) return false;
      if (f.minWarranty && p.warranty < f.minWarranty) return false;
      if (f.maxPrice != null && p.price > f.maxPrice) return false;
      if (f.minPrice != null && p.price < f.minPrice) return false;
      if (f.search) {
        const hay = (p.title + ' ' + p.brand + ' ' + p.model + ' ' + p.sku).toLowerCase();
        if (hay.indexOf(f.search.toLowerCase()) === -1) return false;
      }
      return true;
    });
  }

  /* ---------------------------------------------------------- mockadapter -- */

  function MockAdapter() {
    return {
      name: 'mock',
      async listCategories() { return WK.CATEGORIES; },
      async listProducts(f) {
        const list = sortList(applyFilters(WK.PRODUCTS, f), f && f.sort);
        return { items: list, total: list.length, cursor: null };
      },
      async getProduct(slug) { return WK.bySlug(slug) || null; },
      async createCheckout() { return null; }   // demo rekent lokaal af
    };
  }

  /* ------------------------------------------------------- shopifyadapter -- */

  const SHOPIFY_PRODUCT_FIELDS = `
    id handle title vendor productType availableForSale description tags
    featuredImage { url altText }
    images(first: 8) { nodes { url altText } }
    priceRange { minVariantPrice { amount } }
    compareAtPriceRange { maxVariantPrice { amount } }
    variants(first: 1) { nodes { id sku quantityAvailable availableForSale } }
    conditie:   metafield(namespace: "wk", key: "conditie") { value }
    garantie:   metafield(namespace: "wk", key: "garantie_maanden") { value }
    bouwjaar:   metafield(namespace: "wk", key: "bouwjaar") { value }
    specs:      metafield(namespace: "wk", key: "specificaties") { value }
    highlights: metafield(namespace: "wk", key: "pluspunten") { value }
    keuring:    metafield(namespace: "wk", key: "keuringsrapport") { value }
  `;

  function ShopifyAdapter(cfg) {
    const endpoint = 'https://' + cfg.domain + '/api/' + cfg.apiVersion + '/graphql.json';

    async function gql(query, variables) {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Shopify-Storefront-Access-Token': cfg.storefrontToken
        },
        body: JSON.stringify({ query, variables })
      });
      if (!res.ok) throw new Error('Shopify gaf status ' + res.status);
      const json = await res.json();
      if (json.errors) throw new Error(json.errors.map(e => e.message).join('; '));
      return json.data;
    }

    /* JSON-metafields kunnen leeg of ongeldig zijn; nooit de pagina laten vallen. */
    function parseJSON(mf, fallback) {
      if (!mf || !mf.value) return fallback;
      try { return JSON.parse(mf.value); } catch (e) { return fallback; }
    }

    function map(n) {
      const v = (n.variants.nodes && n.variants.nodes[0]) || {};
      const price = toNum(n.priceRange.minVariantPrice.amount);
      const compare = toNum(n.compareAtPriceRange.maxVariantPrice.amount);
      const images = (n.images.nodes || []).map(i => ({ url: i.url, alt: i.altText || n.title }));
      return {
        id: n.id,
        variantId: v.id,
        slug: n.handle,
        sku: norm(v.sku),
        title: n.title,
        brand: norm(n.vendor),
        model: '',
        cat: slugFromType(n.productType),
        kind: kindFromType(n.productType),
        /* Outlet is in Shopify een tag, niet een producttype. */
        outlet: (n.tags || []).indexOf('outlet') > -1,
        price,
        compareAt: compare > price ? compare : 0,
        cond: norm(n.conditie && n.conditie.value) || 'Refurbished A',
        warranty: parseInt((n.garantie && n.garantie.value) || '6', 10),
        year: parseInt((n.bouwjaar && n.bouwjaar.value) || '0', 10),
        rating: 4.6, reviews: 0,          // vul uit je reviewpartner (Kiyoh/Judge.me)
        stock: v.quantityAvailable != null ? v.quantityAvailable : (n.availableForSale ? 1 : 0),
        available: !!n.availableForSale,
        specs: parseJSON(n.specs, {}),
        highlights: parseJSON(n.highlights, []),
        refurb: parseJSON(n.keuring, []),
        images,
        addedDaysAgo: 0
      };
    }

    function slugFromType(t) {
      const hit = WK.CATEGORIES.find(c => c.label.toLowerCase() === norm(t).toLowerCase());
      return hit ? hit.slug : 'overig';
    }
    function kindFromType(t) {
      const hit = WK.CATEGORIES.find(c => c.label.toLowerCase() === norm(t).toLowerCase());
      return hit ? hit.kind : 'wasmachine';
    }

    const SORT = {
      'price-asc':  { sortKey: 'PRICE', reverse: false },
      'price-desc': { sortKey: 'PRICE', reverse: true },
      'nieuwste':   { sortKey: 'CREATED_AT', reverse: true },
      'korting':    { sortKey: 'BEST_SELLING', reverse: false },
      'relevantie': { sortKey: 'BEST_SELLING', reverse: false }
    };

    return {
      name: 'shopify',

      async listCategories() { return WK.CATEGORIES; },

      async listProducts(f) {
        f = f || {};
        const terms = [];
        if (f.category === 'outlet') {
          terms.push('tag:outlet');
        } else if (f.category) {
          const c = WK.CATEGORIES.find(x => x.slug === f.category);
          if (c) terms.push('product_type:"' + c.label + '"');
        }
        if (f.brands && f.brands.length) {
          terms.push('(' + f.brands.map(b => 'vendor:"' + b + '"').join(' OR ') + ')');
        }
        if (f.minPrice != null || f.maxPrice != null) {
          terms.push('variants.price:>=' + (f.minPrice || 0) +
                     (f.maxPrice != null ? ' variants.price:<=' + f.maxPrice : ''));
        }
        if (f.search) terms.push(f.search);

        const s = SORT[f.sort] || SORT.relevantie;
        const data = await gql(
          'query P($first:Int!,$q:String,$k:ProductSortKeys,$r:Boolean,$after:String){' +
          ' products(first:$first, query:$q, sortKey:$k, reverse:$r, after:$after){' +
          '  pageInfo{ hasNextPage endCursor } nodes{' + SHOPIFY_PRODUCT_FIELDS + '} } }',
          { first: f.limit || 48, q: terms.join(' ') || null, k: s.sortKey, r: s.reverse, after: f.cursor || null }
        );
        const items = data.products.nodes.map(map);
        return {
          items,
          total: items.length,
          cursor: data.products.pageInfo.hasNextPage ? data.products.pageInfo.endCursor : null
        };
      },

      async getProduct(handle) {
        const data = await gql(
          'query P($h:String!){ product(handle:$h){' + SHOPIFY_PRODUCT_FIELDS + '} }',
          { h: handle }
        );
        return data.product ? map(data.product) : null;
      },

      /* Levert de Shopify-checkout-URL op. De demo-checkout in deze build is
         alleen een ontwerp; live neemt Shopify het hier over. */
      async createCheckout(lines) {
        const data = await gql(
          'mutation C($lines:[CartLineInput!]!){ cartCreate(input:{lines:$lines}){' +
          ' cart{ checkoutUrl } userErrors{ message } } }',
          { lines: lines.map(l => ({ merchandiseId: l.variantId, quantity: l.qty })) }
        );
        const r = data.cartCreate;
        if (r.userErrors && r.userErrors.length) throw new Error(r.userErrors[0].message);
        return { url: r.cart.checkoutUrl };
      }
    };
  }

  /* --------------------------------------------------- woocommerceadapter -- */

  function WooAdapter(cfg) {
    const root = cfg.baseUrl.replace(/\/$/, '') + cfg.apiRoot;

    async function get(path, params) {
      const url = new URL(root + path);
      Object.keys(params || {}).forEach(k => {
        if (params[k] != null && params[k] !== '') url.searchParams.set(k, params[k]);
      });
      const res = await fetch(url.toString(), { headers: { Accept: 'application/json' } });
      if (!res.ok) throw new Error('WooCommerce gaf status ' + res.status);
      return { body: await res.json(), total: parseInt(res.headers.get('X-WP-Total') || '0', 10) };
    }

    /* De Store API geeft prijzen als string in de kleinste eenheid. */
    function money(prices, key) {
      if (!prices || !prices[key]) return 0;
      const minor = prices.currency_minor_unit == null ? 2 : prices.currency_minor_unit;
      return toNum(prices[key]) / Math.pow(10, minor);
    }

    /* wk_-velden komen mee via de extensions-sleutel. Zie README voor het
       mu-plugin snippet dat ze registreert; zonder dat blijft de fallback staan. */
    function ext(p) { return (p.extensions && p.extensions.wk) || {}; }

    function attr(p, name) {
      const a = (p.attributes || []).find(x => norm(x.name).toLowerCase() === name);
      return a && a.terms && a.terms.length ? a.terms.map(t => t.name).join(', ') : '';
    }

    function map(p) {
      const e = ext(p);
      const cat = (p.categories && p.categories[0]) || {};
      const price = money(p.prices, 'price');
      const regular = money(p.prices, 'regular_price');
      const known = WK.CATEGORIES.find(c => c.slug === cat.slug);
      return {
        id: p.id,
        variantId: p.id,
        slug: p.slug,
        sku: norm(p.sku),
        title: p.name,
        brand: e.merk || attr(p, 'merk') || '',
        model: e.model || attr(p, 'model') || '',
        cat: known ? known.slug : 'wasmachines',
        kind: known ? known.kind : 'wasmachine',
        /* In WooCommerce is outlet een extra productcategorie naast de hoofdcategorie. */
        outlet: (p.categories || []).some(c => c.slug === 'outlet'),
        price,
        compareAt: regular > price ? regular : 0,
        cond: e.conditie || attr(p, 'conditie') || 'Refurbished A',
        warranty: parseInt(e.garantie_maanden || attr(p, 'garantie') || '6', 10),
        year: parseInt(e.bouwjaar || '0', 10),
        rating: toNum(p.average_rating) || 4.6,
        reviews: p.review_count || 0,
        stock: p.stock_availability && p.is_in_stock === false ? 0 : (p.stock_quantity != null ? p.stock_quantity : 1),
        available: p.is_in_stock !== false,
        specs: e.specificaties || {},
        highlights: e.pluspunten || [],
        refurb: e.keuringsrapport || [],
        images: (p.images || []).map(i => ({ url: i.src, alt: i.alt || p.name })),
        addedDaysAgo: 0
      };
    }

    const ORDER = {
      'price-asc':  { orderby: 'price', order: 'asc' },
      'price-desc': { orderby: 'price', order: 'desc' },
      'nieuwste':   { orderby: 'date',  order: 'desc' },
      'korting':    { orderby: 'popularity', order: 'desc' },
      'relevantie': { orderby: 'popularity', order: 'desc' }
    };

    return {
      name: 'woocommerce',

      async listCategories() {
        const { body } = await get('/products/categories', { per_page: 50 });
        return body
          .filter(c => c.count > 0)
          .map(c => {
            const known = WK.CATEGORIES.find(x => x.slug === c.slug);
            return { slug: c.slug, label: c.name, kind: known ? known.kind : 'wasmachine', blurb: c.description || '' };
          });
      },

      async listProducts(f) {
        f = f || {};
        const o = ORDER[f.sort] || ORDER.relevantie;
        const { body, total } = await get('/products', {
          category: f.category || '',
          search: f.search || '',
          min_price: f.minPrice != null ? f.minPrice * 100 : '',
          max_price: f.maxPrice != null ? f.maxPrice * 100 : '',
          per_page: f.limit || 48,
          page: f.page || 1,
          orderby: o.orderby,
          order: o.order
        });
        let items = body.map(map);
        /* Merk en conditie zitten niet in de Store API-query, dus lokaal filteren. */
        if (f.brands && f.brands.length) items = items.filter(p => f.brands.indexOf(p.brand) > -1);
        if (f.conds && f.conds.length) items = items.filter(p => f.conds.indexOf(p.cond) > -1);
        if (f.minWarranty) items = items.filter(p => p.warranty >= f.minWarranty);
        return { items, total: total || items.length, cursor: null };
      },

      async getProduct(slug) {
        const { body } = await get('/products', { slug });
        return body && body.length ? map(body[0]) : null;
      },

      /* Woo rekent af op de eigen /checkout-pagina. We vullen de servercart
         en sturen door; de Nonce komt uit de cart-respons. */
      async createCheckout(lines) {
        const cartRes = await fetch(root + '/cart', { credentials: 'include' });
        const nonce = cartRes.headers.get('Nonce') || cartRes.headers.get('X-WC-Store-API-Nonce');
        for (const l of lines) {
          await fetch(root + '/cart/add-item', {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json', Nonce: nonce },
            body: JSON.stringify({ id: l.variantId, quantity: l.qty })
          });
        }
        return { url: cfg.baseUrl.replace(/\/$/, '') + '/afrekenen/' };
      }
    };
  }

  /* --------------------------------------------------------------- fabriek -- */

  WK.createStore = function (cfg) {
    switch (cfg.backend) {
      case 'shopify':
        if (!cfg.shopify.storefrontToken) {
          console.warn('[WK] Geen Storefront-token ingesteld — terug naar demodata.');
          return MockAdapter();
        }
        return ShopifyAdapter(cfg.shopify);
      case 'woocommerce':
        return WooAdapter(cfg.woocommerce);
      default:
        return MockAdapter();
    }
  };

  WK.store = WK.createStore(WK.CONFIG);

})(window.WK);


/* assets/js/cart.js */
/* Witgoed Koning — winkelwagen.
   Losse module zodat de checkout-UI niets weet van opslag. In de Shopify-
   variant vervangt cartCreate deze regels; bij WooCommerce spiegelt hij de
   servercart. Daarom staat hier alleen wat de interface nodig heeft. */
window.WK = window.WK || {};

(function (WK) {
  'use strict';

  const KEY = 'wk.cart.v1';
  const listeners = [];

  function read() {
    try {
      const raw = localStorage.getItem(KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];               // privémodus of geblokkeerde opslag
    }
  }

  function write(lines) {
    try { localStorage.setItem(KEY, JSON.stringify(lines)); } catch (e) { /* niet fataal */ }
    listeners.forEach(fn => fn(lines));
  }

  const Cart = {
    lines: () => read(),

    /* Elk toestel is uniek: maximaal de voorraad van dat artikelnummer. */
    add(product, qty) {
      const lines = read();
      const hit = lines.find(l => l.id === product.id);
      const max = Math.max(1, product.stock || 1);
      if (hit) hit.qty = Math.min(max, hit.qty + (qty || 1));
      else lines.push({
        id: product.id, variantId: product.variantId || product.id, slug: product.slug,
        title: product.title, brand: product.brand, sku: product.sku, kind: product.kind,
        price: product.price, compareAt: product.compareAt, warranty: product.warranty,
        qty: Math.min(max, qty || 1), max
      });
      write(lines);
      return lines;
    },

    setQty(id, qty) {
      const lines = read();
      const hit = lines.find(l => l.id === id);
      if (!hit) return lines;
      hit.qty = Math.max(1, Math.min(hit.max || 1, qty));
      write(lines);
      return lines;
    },

    remove(id) {
      write(read().filter(l => l.id !== id));
    },

    clear() { write([]); },

    /* Extra's die geen catalogusartikel zijn (verlengde garantie, montage). */
    addService(svc) {
      const lines = read();
      if (lines.some(l => l.id === svc.id)) return lines;
      lines.push(Object.assign({ qty: 1, max: 1, service: true }, svc));
      write(lines);
      return lines;
    },

    count() { return read().reduce((n, l) => n + l.qty, 0); },

    totals() {
      const lines = read();
      const subtotal = lines.reduce((n, l) => n + l.price * l.qty, 0);
      const wasTotal = lines.reduce((n, l) => n + (l.compareAt || l.price) * l.qty, 0);
      return {
        subtotal,
        saving: Math.max(0, wasTotal - subtotal),
        shipping: 0,                       // bezorgen en aansluiten is inbegrepen
        removal: 0,                        // oud apparaat meenemen is inbegrepen
        total: subtotal,
        vat: subtotal - subtotal / 1.21    // btw is in de prijs verwerkt
      };
    },

    onChange(fn) { listeners.push(fn); return () => listeners.splice(listeners.indexOf(fn), 1); }
  };

  WK.cart = Cart;

})(window.WK);

    ['price-asc', 'Prijs laag – hoog'],
    ['price-desc', 'Prijs hoog – laag'],
    ['nieuwste', 'Nieuwste eerst'],
    ['korting', 'Hoogste korting']
  ];

  let state = null;

  function fresh(category, search) {
    return { category: category || null, search: search || '', brands: [], conds: [], minWarranty: 0, maxPrice: null, sort: 'relevantie' };
  }

  WK.views.plp = async function (params) {
    const cat = params.category || null;
    const search = params.search || '';
    if (!state || state.category !== cat || state.search !== search) state = fresh(cat, search);

    const meta = cat ? WK.CATEGORIES.find(c => c.slug === cat) : null;
    const scope = await WK.store.listProducts({ category: cat, search, limit: 200 });
    const facets = buildFacets(scope.items);

    const title = meta ? meta.label : (search ? 'Zoekresultaten voor “' + esc(search) + '”' : 'Hele assortiment');
    const blurb = meta ? meta.blurb : 'Alles wat er op dit moment gekeurd en wel in Deventer staat.';

    return '<div class="wrap">' +
      P.crumbs([{ label: 'Home', href: '#/' }, { label: title }]) +
      '<div class="plp">' +
        '<aside class="filters" aria-label="Filters">' + renderFilters(facets) + '</aside>' +
        '<div>' +
          '<div class="plp-head">' +
            '<div><h1>' + title + '</h1><p>' + blurb + '</p></div>' +
            '<div class="sortbar"><label for="sortsel">Sorteren</label>' +
              '<select id="sortsel" data-sort>' + SORTS.map(s =>
                '<option value="' + s[0] + '"' + (state.sort === s[0] ? ' selected' : '') + '>' + s[1] + '</option>'
              ).join('') + '</select></div>' +
          '</div>' +
          '<div data-results>' + await renderResults() + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  };

  function buildFacets(items) {
    const brands = {}, conds = {};
    let max = 0;
    items.forEach(p => {
      brands[p.brand] = (brands[p.brand] || 0) + 1;
      conds[p.cond] = (conds[p.cond] || 0) + 1;
      max = Math.max(max, p.price);
    });
    return {
      brands: Object.keys(brands).sort().map(b => ({ v: b, n: brands[b] })),
      conds: ['Nieuwstaat', 'Refurbished A', 'Refurbished B'].filter(c => conds[c]).map(c => ({ v: c, n: conds[c] })),
      maxPrice: Math.max(100, Math.ceil(max / 50) * 50)
    };
  }

  function renderFilters(f) {
    const price = state.maxPrice == null ? f.maxPrice : state.maxPrice;
    const box = (key, list) => list.map(o =>
      '<label class="fopt"><input type="checkbox" data-f="' + key + '" value="' + esc(o.v) + '"' +
      (state[key].indexOf(o.v) > -1 ? ' checked' : '') + '>' + esc(o.v) +
      '<span class="cnt">' + o.n + '</span></label>').join('');

    return '<div class="fgroup"><b>Merk</b>' + box('brands', f.brands) + '</div>' +
      '<div class="fgroup"><b>Staat</b>' + box('conds', f.conds) +
        '<p class="fhint">Refurbished B is technisch net zo goed, maar heeft zichtbare gebruikssporen. ' +
        'Die staan bij het apparaat op de foto.</p></div>' +
      '<div class="fgroup"><b>Garantie</b>' +
        '<label class="fopt"><input type="checkbox" data-f="minWarranty" value="12"' +
        (state.minWarranty === 12 ? ' checked' : '') + '>Minimaal 12 maanden</label></div>' +
      '<div class="fgroup"><b>Prijs tot ' + euro(price) + '</b>' +
        '<input type="range" data-f="maxPrice" min="50" max="' + f.maxPrice + '" step="10" value="' + price +
        '" style="width:100%;accent-color:var(--cta);margin-top:4px" aria-label="Maximumprijs">' +
        '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)">' +
          '<span>' + euro(50) + '</span><span>' + euro(f.maxPrice) + '</span></div></div>' +
      '<div class="fgroup" style="border-bottom:0">' +
        '<button class="btn btn-quiet" data-reset style="padding-left:0">Alle filters wissen</button></div>';
  }

  async function renderResults() {
    const { items } = await WK.store.listProducts(state);
    const chips = activeChips();
    if (!items.length) {
      return chips + '<div class="empty"><h2>Geen apparaten met deze combinatie</h2>' +
        '<p class="muted" style="margin:8px 0 14px">Wis een filter, of bel ons op ' + esc(WK.SHOP.phone) +
        ' — de voorraad wisselt dagelijks en wij zoeken graag mee.</p>' +
        '<button class="btn btn-ghost" data-reset>Filters wissen</button></div>';
    }
    return chips +
      '<p class="resultcount">' + items.length + ' apparaten gevonden, allemaal op voorraad in Deventer</p>' +
      '<div class="plist">' + items.map(P.row).join('') + '</div>';
  }

  function activeChips() {
    const chips = [];
    state.brands.forEach(b => chips.push(['brands', b, b]));
    state.conds.forEach(c => chips.push(['conds', c, c]));
    if (state.minWarranty) chips.push(['minWarranty', '12', 'Minimaal 12 maanden garantie']);
    if (state.maxPrice != null) chips.push(['maxPrice', '', 'Tot ' + euro(state.maxPrice)]);
    if (!chips.length) return '';
    return '<div class="chips-active">' + chips.map(c =>
      '<button class="chip-x" data-clear="' + c[0] + '" data-val="' + esc(c[1]) + '">' +
      esc(c[2]) + icon('x', 12) + '</button>').join('') + '</div>';
  }

  WK.mounts.plp = function (root) {
    const results = root.querySelector('[data-results]');
    const rerender = async () => { results.innerHTML = await renderResults(); bindChips(); };

    root.addEventListener('change', async (e) => {
      const el = e.target.closest('[data-f]');
      if (!el) return;
      const key = el.dataset.f;
      if (el.type === 'checkbox') {
        if (key === 'minWarranty') state.minWarranty = el.checked ? 12 : 0;
        else {
          const arr = state[key], i = arr.indexOf(el.value);
          if (el.checked && i === -1) arr.push(el.value);
          if (!el.checked && i > -1) arr.splice(i, 1);
        }
      } else if (el.type === 'range') {
        state.maxPrice = parseInt(el.value, 10);
        const label = el.closest('.fgroup').querySelector('b');
        if (label) label.textContent = 'Prijs tot ' + euro(state.maxPrice);
      }
      await rerender();
    });

    const sortSel = root.querySelector('[data-sort]');
    if (sortSel) sortSel.addEventListener('change', async () => { state.sort = sortSel.value; await rerender(); });

    function bindChips() {
      root.querySelectorAll('[data-clear]').forEach(btn => btn.addEventListener('click', () => {
        const k = btn.dataset.clear;
        if (k === 'maxPrice') state.maxPrice = null;
        else if (k === 'minWarranty') state.minWarranty = 0;
        else state[k] = state[k].filter(v => v !== btn.dataset.val);
        WK.rerender();
      }));
    }

    root.querySelectorAll('[data-reset]').forEach(b => b.addEventListener('click', () => {
      state = fresh(state.category, state.search);
      WK.rerender();
    }));

    bindChips();
  };

})(window.WK);

        '<button class="btn btn-primary" data-add="' + esc(p.slug) + '">In winkelwagen</button>' +
      '</div>' +
    '</div>';
  };

  function gallery(p) {
    return '<div>' +
      '<div class="gallery-main">' + P.media(p, 260) +
        '<span class="gallery-note" data-note>' + esc(SHOTS[0][1].replace('%s', p.sku)) + '</span></div>' +
      '<div class="gallery-thumbs">' + SHOTS.map((v, i) =>
        '<button class="gthumb' + (i === 0 ? ' on' : '') + '" data-shot="' + i + '" ' +
        'aria-label="' + esc(v[0]) + '">' + WK.appliance(p.kind, 46) + '</button>').join('') + '</div>' +
    '</div>';

  function why(p) {
    return '<div>' +
      '<h2 style="font-size:18px">Waarom u dit apparaat wilt</h2>' +
      '<ul class="why">' + (p.highlights || []).map(h =>
        '<li>' + icon('check', 15) + '<span>' + esc(h) + '</span></li>').join('') +
        '<li>' + icon('check', 15) + '<span>' + p.warranty + ' maanden garantie, bij storing komt onze monteur bij u thuis</span></li>' +
      '</ul>' +
      (p.outlet && p.outletReason
        ? '<div class="notice" style="margin-top:14px">' + icon('info', 16) +
          '<span><b style="color:var(--text)">Outlet-apparaat.</b> ' + esc(p.outletReason) +
          ' Op de techniek en de garantie maakt dat niets uit — op de prijs wel.</span></div>'
        : '') +
      '<p class="muted" style="margin-top:14px;font-size:13.5px">Dit is één specifiek toestel met een eigen ' +
        'artikelnummer. Er is geen tweede exemplaar van.</p>' +
    '</div>';
  }

  function buybox(p) {
    const save = WK.savingPct(p);
    const dag = WK.formatDate(WK.deliveryDate(2));
    return '<aside class="buybox">' +
      '<div class="pricebox">' +
        '<div class="price-row"><span class="price">' + euro(p.price) + '</span>' +

        (save ? '<span class="saving">U bespaart ' + euro(p.compareAt - p.price) + ' (' + save + '%)</span>' : '') +
        '<span class="incl">Inclusief btw, bezorging, aansluiten en het meenemen van uw oude apparaat. ' +
          'Er komt niets meer bij.</span>' +
      '</div>' +

      '<ul class="assurances">' +
        '<li>' + icon('check', 15) + '<span><b>' + p.warranty + ' maanden garantie</b>, monteur aan huis</span></li>' +
        '<li>' + icon('check', 15) + '<span><b>Gratis bezorgd en aangesloten</b>, ook op de eerste verdieping</span></li>' +
        '<li>' + icon('check', 15) + '<span><b>Oud apparaat gratis mee</b>, ook als u het niet bij ons kocht</span></li>' +
        '<li>' + icon('check', 15) + '<span><b>14 dagen bedenktijd</b>, wij halen het kosteloos op</span></li>' +
      '</ul>' +

      '<div class="deliverybox">' +
        '<b>Wanneer is hij bij u?</b>' +
        '<form class="pc-form" data-pc>' +
          '<input name="pc" placeholder="1234 AB" maxlength="7" autocomplete="postal-code" aria-label="Postcode">' +
          '<button class="btn btn-ghost" type="submit">Bekijk</button>' +
        '</form>' +
        '<p class="pc-result" data-pc-result>Standaard bezorgd op <b>' + esc(dag) +
          '</b> als u vandaag vóór 16:00 bestelt.</p>' +
      '</div>' +

      '<button class="btn btn-primary btn-lg" data-add="' + esc(p.slug) + '">' +
        icon('cart', 18) + 'In winkelwagen</button>' +
      '<a class="btn btn-ghost" href="#/showroom" style="width:100%">Eerst bekijken in de showroom</a>' +

      '<div class="paystrip">' + ['iDEAL', 'Pinnen bij levering', 'Klarna', 'in3']
        .map(x => '<span>' + x + '</span>').join('') + '</div>' +

      '<p class="muted" style="font-size:13px">Twijfelt u over de maten of de aansluiting? Bel ' +
        '<a class="linkblue" href="tel:' + WK.SHOP.phoneHref + '">' + esc(WK.SHOP.phone) +
        '</a> — wij nemen zelf op.</p>' +
    '</aside>';
  }

  function sections(p, related) {
    const specRows = Object.keys(p.specs).map(k =>
      '<tr><th scope="row">' + esc(k) + '</th><td>' + esc(p.specs[k]) + '</td></tr>').join('');
    const replaced = (p.refurb || []).filter(r => r.status === 'repl').length;
    const opgemaakt = WK.formatDate(WK.deliveryDate(-0, Date.now() - 9 * 864e5), true);

    return '<div class="pdp-sections">' +

      '<section><h2>Keuringsrapport van dit exemplaar</h2>' +
        '<p class="muted" style="margin-bottom:12px;max-width:66ch">Opgemaakt door onze monteur op ' +
          esc(opgemaakt) + '. ' + (replaced ? replaced + ' onderde' + (replaced === 1 ? 'el' : 'len') +
          ' vervangen, ' : '') + 'alle overige punten gecontroleerd en akkoord bevonden.</p>' +
        '<div class="panel">' +
          '<div class="panel-head"><b>' + esc(p.brand) + ' ' + esc(p.model) + '</b><span>' + esc(p.sku) + '</span></div>' +
          '<ul class="check-list">' + (p.refurb || []).map(P.checkRow).join('') + '</ul>' +
        '</div></section>' +

      '<section><h2>Specificaties</h2>' +
        '<div class="table-scroll"><table class="spec-table"><tbody>' + specRows +
          '<tr><th scope="row">Artikelnummer</th><td>' + esc(p.sku) + '</td></tr>' +
          '<tr><th scope="row">Staat</th><td>' + esc(p.cond) + (p.outlet ? ' (outlet)' : '') + '</td></tr>' +
          '<tr><th scope="row">Garantie</th><td>' + p.warranty + ' maanden</td></tr>' +
        '</tbody></table></div></section>' +

      (related.length ? '<section><h2>Andere ' +
        esc(((WK.CATEGORIES.find(c => c.slug === p.cat) || {}).label || 'apparaten').toLowerCase()) +
        ' op voorraad</h2><div class="plist">' + related.map(P.row).join('') + '</div></section>' : '') +

      '<section><h2>Vragen over dit apparaat</h2>' + P.faq(WK.FAQ.slice(0, 5)) + '</section>' +
    '</div>';
  }

  WK.mounts.pdp = function (root, params) {
    const note = root.querySelector('[data-note]');
    const sku = (WK.bySlug(params.slug) || {}).sku || '';
    root.querySelectorAll('[data-shot]').forEach(btn => btn.addEventListener('click', () => {
      root.querySelectorAll('[data-shot]').forEach(b => b.classList.remove('on'));
      btn.classList.add('on');
      note.textContent = SHOTS[parseInt(btn.dataset.shot, 10)][1].replace('%s', sku);
    }));

    /* Bezorgbelofte op postcode. Overijssel en de Randstad rijden wij zelf,
       de rest gaat via een extra rit — dus dat duurt een dag langer. */
    const form = root.querySelector('[data-pc]');
    const out = root.querySelector('[data-pc-result]');
    if (form) form.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = form.pc.value.trim();
      if (!WK.validPostcode(val)) {
        out.className = 'pc-result err';
        out.textContent = 'Vul een Nederlandse postcode in, bijvoorbeeld 7418 CJ.';
        return;
      }
      const d4 = parseInt(val.slice(0, 4), 10);
      const snel = (d4 >= 7000 && d4 < 8300) || (d4 >= 1000 && d4 < 3600);
      out.className = 'pc-result';
      out.innerHTML = 'Bezorgd en aangesloten op <b>' + esc(WK.formatDate(WK.deliveryDate(snel ? 2 : 3))) +
        '</b>. U kiest zelf een dagdeel bij het afrekenen.' + (snel ? ' Uw regio rijden wij zelf.' : '');
    });

    const sticky = root.querySelector('[data-sticky]');
    const anchor = root.querySelector('.buybox .btn-primary');
    if (sticky && anchor && 'IntersectionObserver' in window) {
      document.body.classList.add('has-sticky');
      const io = new IntersectionObserver(([entry]) => sticky.classList.toggle('show', !entry.isIntersecting));
      io.observe(anchor);
      WK.onLeave(() => { io.disconnect(); document.body.classList.remove('has-sticky'); });
    }
  };

})(window.WK);
