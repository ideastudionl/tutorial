<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Offerte configurator - Fortis Kozijnen</title>
  <meta name="description" content="Stel online uw kozijn samen: materiaal, profiel, vakverdeling, beglazing, ventilatieroosters en horren. U ziet direct een prijsindicatie en vraagt in één klik een vrijblijvende offerte aan.">
  <meta name="robots" content="index, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/configurator.css">

  <style>
    body {
      margin: 0;
      background: #f2f5f9;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    /* Valt weg zodra de configurator geladen is */
    .fk-laden { padding: 60px 20px; text-align: center; color: #5b6875; }

    /* Demobalk: alleen zichtbaar op de demo-omgeving, niet op de live site */
    .fk-demobalk {
      background: #123a5c;
      color: #dce7f1;
      font-size: 13.5px;
      line-height: 1.5;
      padding: 12px 20px;
    }
    .fk-demobalk .binnen {
      max-width: 1180px; margin: 0 auto;
      display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: baseline;
    }
    .fk-demobalk strong { color: #fff; font-weight: 600; letter-spacing: .01em; }
    .fk-demobalk span { opacity: .85; }
  </style>
</head>
<body>

  <!--
    ==========================================================================
    Plaats dit element op de pagina waar de configurator moet verschijnen.
    De drie scriptbestanden onderaan doen de rest.
    ==========================================================================
  -->
  <div class="fk-demobalk" id="fk-demobalk" hidden>
    <div class="binnen">
      <strong>Ideastudio demo kozijnen offerte</strong>
      <span>Voorbeeldprijzen — aanvragen worden in deze demo niet verstuurd.</span>
    </div>
  </div>

  <div id="fortis-configurator">
    <div class="fk-laden">De configurator wordt geladen…</div>
  </div>

  <noscript>
    <div style="max-width:700px;margin:40px auto;padding:20px;background:#fff;border-radius:12px">
      <h2>JavaScript staat uit</h2>
      <p>Voor de configurator is JavaScript nodig. Zet JavaScript aan of neem contact met ons op,
         dan stellen wij de offerte samen met u op.</p>
    </div>
  </noscript>

  <script>
    /*
      De demobalk verschijnt alleen op de demo-omgeving (een vercel.app-adres)
      of wanneer ?demo=1 aan het adres wordt toegevoegd. Op de eigen website
      van Fortis Kozijnen blijft hij dus onzichtbaar.
    */
    (function () {
      var demo = /(^|\.)vercel\.app$/.test(location.hostname) ||
                 /[?&]demo=1(&|$)/.test(location.search);
      if (!demo) return;
      var balk = document.getElementById('fk-demobalk');
      if (balk) balk.hidden = false;
      document.title = 'Ideastudio demo kozijnen offerte';
    })();
  </script>

  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/pricing.js"></script>
  <script src="assets/js/preview.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    /*
      Hoogte doorgeven aan de website wanneer de configurator in een iframe
      staat (zie embed.js). Zonder iframe gebeurt hier niets.
    */
    (function () {
      if (window.parent === window) return;
      function meld() {
        var hoogte = Math.ceil(document.documentElement.scrollHeight);
        window.parent.postMessage({ type: 'fortis-configurator:hoogte', hoogte: hoogte }, '*');
      }
      window.addEventListener('load', meld);
      if ('ResizeObserver' in window) new ResizeObserver(meld).observe(document.body);
      else setInterval(meld, 500);
    })();
  </script>
</body>
</html>
